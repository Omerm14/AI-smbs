<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עומר מורן — בינה מלאכותית לעסקים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --bg2: #f3f2ee;
      --surface: #ffffff;
      --border: rgba(14,14,12,0.08);
      --border-mid: rgba(14,14,12,0.14);
      --gold: #456abf;
      --gold-rgb: 69,106,191;
      --gold-light: #456abf55;
      --gold-pale: #456abf12;
      --text: #0e0e0c;
      --text-dim: #5a5a54;
      --text-dimmer: #9a9a90;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
    }
    #root { position: relative; z-index: 1; }

    #cursor-glow {
      pointer-events: none; position: fixed; z-index: 9999;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb), 0.18) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      mix-blend-mode: multiply;
    }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 64px;
      transition: padding 0.4s, background 0.4s, box-shadow 0.4s;
    }
    nav.scrolled {
      padding: 16px 64px;
      background: rgba(250,249,246,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 var(--border);
    }
    .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--text);
      text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 40px; list-style: none; flex-direction: row-reverse; }
    .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      font-family: 'Heebo', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.04em;
      padding: 11px 26px;
      background: var(--text); color: var(--bg);
      text-decoration: none; display: inline-block;
      position: relative; overflow: hidden;
      transition: background 0.3s;
    }

    /* Language Toggle */
    .lang-toggle { display: flex; align-items: center; border: 1px solid var(--border-mid); border-radius: 100px; padding: 3px; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); gap: 2px; }
    .lang-btn { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 13px; text-decoration: none; color: var(--text-dim); transition: color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease; border-radius: 100px; }
    .lang-btn.active { background: var(--text); color: var(--bg); box-shadow: 0 2px 8px rgba(14,14,12,0.18); }
    .lang-btn:not(.active):hover { color: var(--text); background: rgba(14,14,12,0.06); transform: scale(1.04); }

    /* Testimonials - redesigned */
    .testimonials-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .testimonials-section::before { content: ''; position: absolute; top: -300px; left: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.07) 0%, transparent 70%); pointer-events: none; }
    .testimonials-intro { max-width: 540px; margin-bottom: 60px; }
    .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,0.06); }
    .tcard {
      background: rgba(255,255,255,0.03);
      padding: 36px 32px;
      position: relative;
      transition: background 0.3s;
      cursor: default;
      display: flex; flex-direction: column; gap: 20px;
    }
    .tcard:hover { background: rgba(255,255,255,0.06); }
    .tcard-featured { background: rgba(var(--gold-rgb),0.07); }
    .tcard-featured:hover { background: rgba(var(--gold-rgb),0.11); }
    .tcard-quote {
      font-size: 13px; line-height: 1.85; color: rgba(250,249,246,0.72);
      font-weight: 300; flex: 1;
      position: relative;
    }
    .tcard-quote::before {
      content: '"';
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px; line-height: 0.7;
      color: var(--gold); opacity: 0.4;
      display: block; margin-bottom: 12px;
    }
    .tcard-quote strong { color: rgba(250,249,246,0.95); font-weight: 600; }
    .tcard-author { display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
    .tcard-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: rgba(var(--gold-rgb),0.15);
      border: 1px solid rgba(var(--gold-rgb),0.3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--gold);
    }
    .tcard-name { font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700; color: rgba(250,249,246,0.9); margin-bottom: 2px; }
    .tcard-role { font-size: 11px; color: rgba(250,249,246,0.38); line-height: 1.4; }
    .tcard-badge { position: absolute; top: 0; right: 32px; background: var(--gold); color: white; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 10px; }
    .nav-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: translateX(100%); transition: transform 0.5s ease; }
    .nav-cta:hover { background: var(--gold); }
    .nav-cta:hover::after { transform: translateX(-100%); }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 120px 64px 80px;
      gap: 80px;
      position: relative; overflow: hidden;
    }
    .hero-bg-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(var(--gold-rgb),0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--gold-rgb),0.045) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }
    .hero-glow {
      position: absolute; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb),0.13) 0%, transparent 65%);
      left: -8%; top: 50%; transform: translateY(-50%);
      pointer-events: none; filter: blur(40px);
      animation: floatGlow 7s ease-in-out infinite alternate;
    }
    @keyframes floatGlow { 0% { transform: translateY(-50%) scale(1); } 100% { transform: translateY(-56%) scale(1.1); } }
    .hero-content { position: relative; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 32px;
      opacity: 0; animation: fadeUp 0.6s 0.1s ease forwards;
    }
    .hero-eyebrow-line { display: inline-block; width: 32px; height: 1px; background: var(--gold); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .hero-title {
      font-family: 'Heebo', sans-serif;
      font-size: clamp(40px, 4.5vw, 70px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards;
    }
    .hero-title .accent { color: var(--gold); }
    .hero-sub {
      font-size: 18px; line-height: 1.8;
      color: var(--text-dim);
      max-width: 500px; margin-bottom: 52px;
      font-weight: 300;
      opacity: 0; animation: fadeUp 0.8s 0.55s ease forwards;
    }
    .hero-actions {
      display: flex; gap: 20px; align-items: center;
      opacity: 0; animation: fadeUp 0.8s 0.75s ease forwards;
      flex-direction: row;
    }
    .btn-primary {
      font-family: 'Heebo', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 16px 40px;
      background: var(--text); color: var(--bg);
      border: none; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      position: relative; overflow: hidden;
      transition: background 0.3s, transform 0.25s, box-shadow 0.25s;
    }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); transform: translateX(100%); transition: transform 0.55s ease; }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(var(--gold-rgb),0.3); }
    .btn-primary:hover::after { transform: translateX(-100%); }
    .btn-ghost {
      font-size: 14px; color: var(--text-dim);
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      transition: color 0.2s, gap 0.25s;
    }
    .btn-ghost:hover { color: var(--text); gap: 14px; }
    .hero-image-wrap {
      position: relative; display: flex; justify-content: center;
      opacity: 0; animation: fadeUp 1s 0.4s ease forwards;
    }
    .photo-frame { position: relative; width: 400px; }
    .photo-frame img { width: 100%; display: block; filter: contrast(1.02) brightness(1.01); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover img { transform: scale(1.02); }
    .photo-frame::before { content: ''; position: absolute; top: 20px; right: 20px; left: -20px; bottom: -20px; border: 1px solid var(--gold-light); z-index: -1; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover::before { transform: translate(-4px, 4px); }
    .photo-credential {
      position: absolute; bottom: -16px; right: -24px;
      background: var(--surface); border: 1px solid var(--border-mid);
      padding: 16px 22px; box-shadow: 0 12px 48px rgba(14,14,12,0.12);
      min-width: 200px; animation: fadeUp 1s 0.9s ease both;
      text-align: right;
    }
    .cred-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; }
    .cred-name { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .cred-title { font-size: 12px; color: var(--text-dim); }

    /* Marquee */
    .marquee-strip {
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 14px 0; background: var(--text); overflow: hidden;
    }
    .marquee-track { display: flex; animation: marqueeScroll 32s linear infinite; width: max-content; }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-item {
      display: inline-flex; align-items: center; gap: 20px;
      padding: 0 40px; white-space: nowrap;
      font-family: 'Heebo', sans-serif;
      font-size: 12px; font-weight: 700;
      color: rgba(250,249,246,0.45);
    }
    .marquee-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    /* Impact Numbers */
    .impact-section { background: var(--bg); padding: 100px 64px; position: relative; overflow: hidden; }
    .impact-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .impact-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 60px; }
    .impact-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); position: relative; }
    .impact-grid::before { content: ''; position: absolute; top: 0; right: 33.33%; width: 1px; height: 100%; background: var(--border); }
    .impact-grid::after { content: ''; position: absolute; top: 0; right: 66.66%; width: 1px; height: 100%; background: var(--border); }
    .impact-item { padding: 0 56px; display: flex; flex-direction: column; align-items: flex-start; }
    .impact-item:first-child { padding-right: 0; }
    .impact-item:last-child { padding-left: 0; }
    .impact-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(64px, 8vw, 108px);
      font-weight: 700; line-height: 1;
      letter-spacing: -0.04em; color: var(--text);
      display: flex; align-items: baseline; gap: 10px;
      flex-wrap: nowrap; margin-bottom: 20px;
    }
    .impact-number .accent { color: var(--gold); font-size: 0.52em; font-weight: 700; white-space: nowrap; align-self: center; }
    .impact-claim { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.3; }
    .impact-detail { font-size: 14px; line-height: 1.75; color: var(--text-dim); font-weight: 300; max-width: 280px; }

    /* How it works */
    .how-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .how-section::before { content: ''; position: absolute; top: -300px; left: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.08) 0%, transparent 70%); pointer-events: none; }
    .how-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 56px; }
    .how-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .how-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 44px); font-weight: 900; color: #faf9f6; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 64px; }
    .how-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; }
    .how-step { padding: 0 0 0 48px; }
    .how-step:not(:last-child) { padding: 0 48px 0 48px; border-right: 1px solid rgba(255,255,255,0.06); }
    .how-step:last-child { padding: 0 48px 0 0; }
    .how-step-num { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 20px; }
    .how-step-title { font-family: 'Heebo', sans-serif; font-size: 22px; font-weight: 800; color: #faf9f6; margin-bottom: 14px; line-height: 1.2; }
    .how-step-desc { font-size: 14px; line-height: 1.8; color: rgba(250,249,246,0.52); font-weight: 300; }
    .how-cta-row { margin-top: 64px; display: flex; align-items: center; gap: 24px; }
    .how-note { font-size: 13px; color: rgba(250,249,246,0.35); }

    /* Background */
    .background-section { background: var(--bg2); padding: 100px 64px; position: relative; overflow: hidden; }
    .background-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .bg-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    .section-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .section-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .section-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 46px); font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 20px; }
    .bg-tagline { font-size: 16px; line-height: 1.8; color: var(--text-dim); font-weight: 300; margin-bottom: 28px; max-width: 440px; }

    /* Military badge */
    .military-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(var(--gold-rgb), 0.07);
      border: 1px solid rgba(var(--gold-rgb), 0.2);
      padding: 10px 16px; margin-bottom: 20px;
      font-size: 12px; font-weight: 600; color: var(--gold);
    }

    .bg-companies { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .company-chip {
      font-family: 'Heebo', sans-serif;
      font-size: 11px; font-weight: 600;
      padding: 7px 14px; border: 1px solid var(--border-mid);
      color: var(--text-dim); background: var(--surface);
      transition: border-color 0.2s, color 0.2s;
    }
    .company-chip:hover { border-color: var(--gold); color: var(--gold); }
    .bg-linkedin {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700;
      color: var(--gold); text-decoration: none;
      padding-bottom: 3px; border-bottom: 1px solid rgba(var(--gold-rgb), 0.35);
      transition: border-color 0.2s, gap 0.25s;
    }
    .bg-linkedin:hover { border-color: var(--gold); gap: 14px; }
    .bg-milestones { display: flex; flex-direction: column; }
    .milestone {
      display: grid; grid-template-columns: 110px 1fr; gap: 20px;
      padding: 22px 0; border-bottom: 1px solid var(--border);
      align-items: start; transition: padding-right 0.2s; cursor: default;
    }
    .milestone:first-child { border-top: 1px solid var(--border); }
    .milestone:hover { padding-right: 8px; }
    .milestone.milestone-current {
      background: rgba(var(--gold-rgb), 0.06);
      border-right: 2px solid var(--gold);
      padding-right: 16px; margin-right: -16px;
    }
    .milestone.milestone-current:hover { padding-right: 16px; }
    .milestone-year { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; color: var(--gold); letter-spacing: 0.06em; padding-top: 2px; }
    .milestone-title { font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
    .milestone-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
    .milestone-tag {
      display: inline-block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; color: var(--gold);
      background: var(--gold-pale); padding: 3px 8px;
      margin-bottom: 5px;
    }

    /* Services */
    .services-section { background: var(--surface); padding: 100px 64px; position: relative; }
    .services-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .services-header { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-bottom: 20px; align-items: end; }
    .services-desc { font-size: 15px; line-height: 1.8; color: var(--text-dim); font-weight: 300; }
    .services-hint { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 12px; color: var(--text-dimmer); font-style: italic; }
    .services-hint svg { color: var(--gold); flex-shrink: 0; }
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-mid); }

    /* Scanner card */
    .svc-card-wrap { background: var(--surface); }
    .svc-card { position: relative; height: 300px; cursor: pointer; overflow: hidden; background: var(--surface); transition: background 0.5s; }
    .svc-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--gold); transform: scaleX(0); transform-origin: right; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); z-index: 2; }
    .svc-card:hover::before { transform: scaleX(1); }
    .svc-card-beam { position: absolute; top: 0; bottom: 0; width: 3px; z-index: 10; background: linear-gradient(to bottom, transparent, var(--gold), rgba(var(--gold-rgb),0.6), var(--gold), transparent); box-shadow: 0 0 24px 10px rgba(var(--gold-rgb), 0.25); right: -6px; pointer-events: none; transition: none; }
    .svc-card.scanning .svc-card-beam { right: calc(100% + 6px); transition: right 0.55s cubic-bezier(0.4,0,0.4,1); }
    .svc-card-front { position: absolute; inset: 0; padding: 36px 32px; display: flex; flex-direction: column; transition: opacity 0.25s 0.2s, transform 0.3s 0.2s; text-align: right; }
    .svc-card.revealed .svc-card-front { opacity: 0; transform: translateY(-12px); pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
    .svc-card-back { position: absolute; inset: 0; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; background: var(--text); opacity: 0; transform: translateY(12px); transition: opacity 0.25s, transform 0.3s; pointer-events: none; text-align: right; }
    .svc-card.revealed .svc-card-back { opacity: 1; transform: translateY(0); transition: opacity 0.3s 0.22s, transform 0.35s 0.22s; pointer-events: all; }
    .svc-card.revealed { background: var(--text); }
    .svc-card.revealed::before { transform: scaleX(1); }

function AnimatedStat({ target, suffix, prefix = '' }) {

    const obs = new IntersectionObserver(([e]) => {if (e.isIntersecting) {setTriggered(true);obs.disconnect();}}, { threshold: 0.5 });

  useEffect(() => {
    if (!triggered) return;

function ScannerCard({ service: s, delay }) {
  const [revealed, setRevealed] = useState(false);
  const [scanning, setScanning] = useState(false);
  const handleClick = () => {
    if (scanning) return;
    setScanning(true);
    setTimeout(() => {setRevealed((r) => !r);setTimeout(() => setScanning(false), 200);}, 280);
  };
  return (
    <div className="svc-card-wrap reveal" style={{ transitionDelay: `${delay}s` }}>
      <div className={`svc-card${revealed ? ' revealed' : ''}${scanning ? ' scanning' : ''}`} onClick={handleClick}>
        <div className="svc-card-beam"></div>
        <div className="svc-card-front">
          <div className="service-icon">{s.icon}</div>
          <div className="service-name">{s.name}</div>
          <div className="service-desc">{s.desc}</div>
          <div className="svc-tap-hint">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg>
            לחץ לפרטים
          </div>
        </div>
        <div className="svc-card-back">
          <div>
            <div className="back-name">{s.name}</div>
            <div className="back-detail">{s.detail}</div>
          </div>
          <div className="back-close">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
