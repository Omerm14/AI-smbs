<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI לעסקי מזון — עומר מורן</title>
  <meta name="description" content="עומר מורן בונה מערכות AI לעסקי מזון — מסעדות, בתי קפה, קייטרינג ומאפיות. הזמנות אוטומטיות, שירות לקוחות 24/7, ניהול בלי ניירת." />
  <link rel="icon" type="image/jpeg" href="/uploads/photo-1777477389865.JPG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --bg2: #f3f2ee;
      --surface: #ffffff;
      --border: rgba(14,14,12,0.08);
      --border-mid: rgba(14,14,12,0.14);
      --gold: #456abf;
      --gold-rgb: 69,106,191;
      --gold-light: #456abf55;
      --gold-pale: #456abf12;
      --text: #0e0e0c;
      --text-dim: #5a5a54;
      --text-dimmer: #9a9a90;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
    }
    #root { position: relative; z-index: 1; }

    #cursor-glow {
      pointer-events: none; position: fixed; z-index: 9999;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb), 0.15) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      mix-blend-mode: multiply;
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 64px;
      transition: padding 0.4s, background 0.4s, box-shadow 0.4s;
    }
    nav.scrolled {
      padding: 16px 64px;
      background: rgba(250,249,246,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 var(--border);
    }
    .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--text);
      text-transform: uppercase; text-decoration: none;
    }
    .nav-links { display: flex; gap: 40px; list-style: none; flex-direction: row-reverse; }
    .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 0.04em; padding: 11px 26px;
      background: var(--text); color: var(--bg);
      text-decoration: none; display: inline-block;
      position: relative; overflow: hidden; transition: background 0.3s;
    }
    .nav-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: translateX(100%); transition: transform 0.5s ease; }
    .nav-cta:hover { background: var(--gold); }
    .nav-cta:hover::after { transform: translateX(-100%); }

    /* ── Buttons ── */
    .btn-primary {
      font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;
      padding: 16px 40px; background: var(--text); color: var(--bg);
      border: none; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      position: relative; overflow: hidden;
      transition: background 0.3s, transform 0.25s, box-shadow 0.25s;
    }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); transform: translateX(100%); transition: transform 0.55s ease; }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(var(--gold-rgb),0.3); }
    .btn-primary:hover::after { transform: translateX(-100%); }
    .btn-ghost {
      font-size: 14px; color: var(--text-dim);
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      transition: color 0.2s, gap 0.25s;
    }
    .btn-ghost:hover { color: var(--text); gap: 14px; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh; display: grid;
      grid-template-columns: 1fr 1fr; align-items: center;
      padding: 120px 64px 80px; gap: 80px;
      position: relative; overflow: hidden;
    }
    .hero-bg-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(var(--gold-rgb),0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--gold-rgb),0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }
    .hero-glow {
      position: absolute; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb),0.11) 0%, transparent 65%);
      left: -8%; top: 50%; transform: translateY(-50%);
      pointer-events: none; filter: blur(40px);
      animation: floatGlow 7s ease-in-out infinite alternate;
    }
    @keyframes floatGlow { 0% { transform: translateY(-50%) scale(1); } 100% { transform: translateY(-56%) scale(1.1); } }
    .hero-content { position: relative; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 32px;
      opacity: 0; animation: fadeUp 0.6s 0.1s ease forwards;
    }
    .hero-eyebrow-line { display: inline-block; width: 32px; height: 1px; background: var(--gold); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .hero-title {
      font-family: 'Heebo', sans-serif; font-size: clamp(36px, 4vw, 62px);
      font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 28px;
      opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards;
    }
    .hero-title .accent { color: var(--gold); }
    .hero-sub {
      font-size: 18px; line-height: 1.8; color: var(--text-dim);
      max-width: 500px; margin-bottom: 52px; font-weight: 300;
      opacity: 0; animation: fadeUp 0.8s 0.55s ease forwards;
    }
    .hero-actions {
      display: flex; gap: 20px; align-items: center;
      opacity: 0; animation: fadeUp 0.8s 0.75s ease forwards;
    }

    /* ── Hero photo side ── */
    .hero-visual {
      position: relative; display: flex; justify-content: center;
      opacity: 0; animation: fadeUp 1s 0.4s ease forwards;
    }
    .photo-frame { position: relative; width: 380px; }
    .photo-frame img { width: 100%; display: block; filter: contrast(1.02) brightness(1.01); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover img { transform: scale(1.02); }
    .photo-frame::before { content: ''; position: absolute; top: 20px; right: 20px; left: -20px; bottom: -20px; border: 1px solid var(--gold-light); z-index: -1; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover::before { transform: translate(-4px, 4px); }
    .photo-credential {
      position: absolute; bottom: -16px; right: -24px;
      background: var(--surface); border: 1px solid var(--border-mid);
      padding: 16px 22px; box-shadow: 0 12px 48px rgba(14,14,12,0.12);
      min-width: 200px; animation: fadeUp 1s 0.9s ease both;
      text-align: right;
    }
    .cred-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; }
    .cred-name { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .cred-title { font-size: 12px; color: var(--text-dim); }

    /* ── Marquee ── */
    .marquee-strip {
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 14px 0; background: var(--text); overflow: hidden;
    }
    .marquee-track { display: flex; animation: marqueeScroll 32s linear infinite; width: max-content; }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-item {
      display: inline-flex; align-items: center; gap: 20px; padding: 0 40px;
      white-space: nowrap; font-family: 'Heebo', sans-serif;
      font-size: 12px; font-weight: 700; color: rgba(250,249,246,0.4);
    }
    .marquee-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    /* ── Shared ── */
    .section-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .section-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .section-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 46px); font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 20px; }
    .section-sub { font-size: 16px; line-height: 1.8; color: var(--text-dim); font-weight: 300; max-width: 540px; margin-bottom: 60px; }

    /* ── Problem ── */
    .problem-section { background: var(--bg2); padding: 100px 64px; position: relative; }
    .problem-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-mid); }
    .problem-card { background: var(--bg2); padding: 44px 36px 36px; transition: background 0.3s; cursor: default; display: flex; flex-direction: column; }
    .problem-card:hover { background: var(--surface); }
    .prob-icon-wrap { width: 56px; height: 56px; background: var(--gold-pale); border: 1px solid var(--gold-light); display: flex; align-items: center; justify-content: center; margin-bottom: 28px; flex-shrink: 0; }
    .problem-title { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    .problem-desc { font-size: 14px; line-height: 1.85; color: var(--text-dim); font-weight: 300; flex: 1; }
    .problem-cost { display: inline-flex; align-items: center; gap: 7px; margin-top: 24px; font-size: 12px; font-weight: 700; color: #e05252; background: rgba(224,82,82,0.07); border: 1px solid rgba(224,82,82,0.18); padding: 7px 14px; width: fit-content; }

    /* ── Projects (dark) ── */
    .projects-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .projects-section::before { content: ''; position: absolute; top: -300px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.06) 0%, transparent 70%); pointer-events: none; }
    .projects-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 20px; }
    .projects-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .projects-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 44px); font-weight: 900; color: #faf9f6; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 14px; }
    .projects-sub { font-size: 16px; color: rgba(250,249,246,0.4); font-weight: 300; margin-bottom: 56px; max-width: 500px; }
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    /* ── Project card ── */
    .project-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(var(--gold-rgb),0.5);
      padding: 0; display: flex; flex-direction: column;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      overflow: hidden;
    }
    .project-card:hover { border-color: rgba(var(--gold-rgb),0.6); border-top-color: var(--gold); transform: translateY(-5px); box-shadow: 0 20px 48px rgba(0,0,0,0.3); }
    .project-mockup { background: linear-gradient(160deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.35) 100%); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 28px 24px; min-height: 220px; display: flex; align-items: center; justify-content: center; position: relative; }
    .project-num { position: absolute; top: 14px; left: 16px; font-family: 'Space Grotesk',sans-serif; font-size: 11px; font-weight: 700; color: rgba(250,249,246,0.15); letter-spacing: 0.06em; }
    .project-body { padding: 28px 28px 32px; display: flex; flex-direction: column; flex: 1; }
    .project-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .project-tag::before { content: ''; display: inline-block; width: 12px; height: 1px; background: var(--gold); }
    .project-name { font-family: 'Heebo', sans-serif; font-size: 24px; font-weight: 900; color: #faf9f6; margin-bottom: 12px; }
    .project-desc { font-size: 14px; line-height: 1.8; color: rgba(250,249,246,0.55); font-weight: 300; margin-bottom: 24px; flex: 1; }
    .project-outcome {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; color: #25d366;
      padding: 7px 14px; background: rgba(37,211,102,0.07);
      border: 1px solid rgba(37,211,102,0.18); width: fit-content;
    }

    /* ── Floory grid mockup ── */
    .floory-grid { width: 100%; font-family: 'Heebo', sans-serif; }
    .fg-header { display: grid; grid-template-columns: 1.3fr repeat(6,1fr); gap: 1px; margin-bottom: 1px; }
    .fg-row { display: grid; grid-template-columns: 1.3fr repeat(6,1fr); gap: 1px; margin-bottom: 1px; position: relative; }
    .fg-row.ai { background: rgba(var(--gold-rgb),0.07); }
    .fg-cell { background: rgba(255,255,255,0.04); padding: 7px 8px; font-size: 11px; color: rgba(250,249,246,0.45); text-align: center; }
    .fg-cell.h { background: rgba(255,255,255,0.08); font-weight: 700; color: rgba(250,249,246,0.65); }
    .fg-cell.name { text-align: right; padding-right: 10px; color: rgba(250,249,246,0.75); font-weight: 600; }
    .fg-cell.num { font-family: 'Space Grotesk',sans-serif; font-weight: 700; color: rgba(250,249,246,0.85); }
    .fg-cell.num.ai { color: var(--gold); }
    .fg-badge { position: absolute; top: -9px; right: 0; font-size: 8px; font-weight: 700; letter-spacing: 0.05em; color: var(--gold); background: rgba(var(--gold-rgb),0.12); border: 1px solid rgba(var(--gold-rgb),0.25); padding: 2px 7px; }
    .fg-total { margin-top: 10px; display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(var(--gold-rgb),0.06); border: 1px solid rgba(var(--gold-rgb),0.12); }
    .fg-total-label { font-size: 10px; color: rgba(250,249,246,0.4); }
    .fg-total-val { font-family: 'Space Grotesk',sans-serif; font-size: 12px; font-weight: 700; color: var(--gold); }

    /* ── Lia chat mockup ── */
    .lia-chat { width: 100%; max-width: 280px; background: #0d1117; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
    .lia-header { background: #161b22; padding: 11px 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .lia-avatar { width: 30px; height: 30px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .lia-hname { font-size: 12px; font-weight: 700; color: #f1f5f9; font-family: 'Heebo',sans-serif; }
    .lia-online { font-size: 9px; color: #25d366; }
    .lia-body { padding: 12px 10px; display: flex; flex-direction: column; gap: 7px; }
    .lia-b { max-width: 88%; padding: 8px 12px; font-family: 'Heebo',sans-serif; font-size: 11px; line-height: 1.6; color: #f1f5f9; border-radius: 9px; }
    .lia-b.u { background: #2d333b; align-self: flex-end; border-bottom-left-radius: 2px; }
    .lia-b.b { background: #0d2818; border: 1px solid rgba(37,211,102,0.15); align-self: flex-start; border-bottom-right-radius: 2px; }
    .lia-time { font-size: 9px; color: rgba(241,245,249,0.3); margin-top: 3px; }
    .lia-dots { display: flex; gap: 3px; align-items: center; padding: 8px 10px; background: #0d2818; border-radius: 9px; border-bottom-right-radius: 2px; align-self: flex-start; border: 1px solid rgba(37,211,102,0.1); }
    .lia-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(37,211,102,0.5); animation: tp 1.2s ease-in-out infinite; }
    .lia-dot:nth-child(2){animation-delay:.2s} .lia-dot:nth-child(3){animation-delay:.4s}
    @keyframes tp { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }

    /* ── Cashflow mockup ── */
    .cf-card { width: 100%; max-width: 300px; background: #0d111a; border-radius: 10px; overflow: hidden; border: 1px solid #1e2535; }
    .cf-top { padding: 12px 16px; background: #111827; border-bottom: 1px solid #1e2535; display: flex; justify-content: space-between; align-items: center; }
    .cf-title { font-family: 'Space Grotesk',sans-serif; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: .08em; }
    .cf-badge { font-size: 10px; color: #818cf8; background: rgba(99,102,241,.1); padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .cf-row { padding: 10px 16px; border-bottom: 1px solid #1e2535; display: flex; align-items: center; gap: 9px; }
    .cf-row:last-child { border-bottom: none; }
    .cf-ico { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
    .cf-ico.g { background: rgba(239,68,68,.12); color: #ef4444; }
    .cf-ico.w { background: rgba(37,211,102,.1); color: #25d366; }
    .cf-ico.d { background: rgba(99,102,241,.1); color: #818cf8; }
    .cf-info { flex: 1; }
    .cf-sup { font-family: 'Heebo',sans-serif; font-size: 11px; font-weight: 700; color: #e2e8f0; }
    .cf-due { font-size: 9px; color: #64748b; margin-top: 2px; }
    .cf-amt { font-family: 'Space Grotesk',sans-serif; font-size: 12px; font-weight: 700; color: #f1f5f9; margin-left: auto; white-space: nowrap; }
    .cf-pill { font-size: 8px; font-weight: 700; padding: 2px 7px; border-radius: 100px; white-space: nowrap; margin-right: 4px; }
    .cf-pill.p { background: rgba(16,185,129,.12); color: #10b981; }
    .cf-pill.w { background: rgba(99,102,241,.12); color: #818cf8; }
    .cf-pill.u { background: rgba(239,68,68,.12); color: #ef4444; }

    /* ── Services ── */
    .services-section { background: var(--bg); padding: 100px 64px; position: relative; }
    .services-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .services-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }
    .service-card {
      background: var(--surface); border: 1px solid var(--border-mid); padding: 40px 36px;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    .service-card:hover { border-color: rgba(var(--gold-rgb),.3); box-shadow: 0 12px 40px rgba(var(--gold-rgb),.07); transform: translateY(-3px); }
    .svc-icon-wrap { width: 48px; height: 48px; background: var(--gold-pale); border: 1px solid var(--gold-light); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .service-title { font-family: 'Heebo',sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .service-desc { font-size: 14px; line-height: 1.85; color: var(--text-dim); font-weight: 300; }

    /* ── Impact ── */
    .impact-section { background: var(--bg2); padding: 100px 64px; position: relative; }
    .impact-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .impact-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 60px; }
    .impact-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .impact-grid { display: grid; grid-template-columns: repeat(3,1fr); position: relative; }
    .impact-grid::before { content: ''; position: absolute; top: 0; right: 33.33%; width: 1px; height: 100%; background: var(--border); }

      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    function AnimatedStat({ to, suffix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const done = useRef(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting && !done.current) {
            done.current = true;
            const dur = 1400, t0 = performance.now();
            const tick = now => {
              const p = Math.min((now - t0) / dur, 1);
              setVal(Math.round((1 - Math.pow(1 - p, 3)) * to));
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [to]);
      return <span ref={ref}>{val}{suffix}</span>;
    }

                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    חסך 3 שעות הקלדה ביום
                  </div>
                </div>
              </div>

              <div className="project-card reveal">
                <div className="project-mockup"><span className="project-num">02</span><LiaMockup /></div>
                <div className="project-body">
                  <p className="project-tag">שירות לקוחות · עסקי מזון</p>
                  <h3 className="project-name">ליה</h3>
                  <p className="project-desc">בוט וואטסאפ שעונה ללקוחות על כשרות, שעות, תפריט ושריון שולחן, 24/7, בעברית ואנגלית. מה שהוא לא יודע מגיע ישר אליכם.</p>
                  <div className="project-outcome">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    עונה תוך 30 שניות, גם בשבת
                  </div>
                </div>
              </div>

              <div className="project-card reveal">
                <div className="project-mockup"><span className="project-num">03</span><CashflowMockup /></div>
                <div className="project-body">
                  <p className="project-tag">ניהול פיננסי · כל עסק</p>
                  <h3 className="project-name">Cashflow</h3>
                  <p className="project-desc">כל חשבונית שמגיעה, בגמייל, בוואטסאפ, בדרייב, נקראת אוטומטית ומסודרת בלוח בקרה אחד. תמיד יודעים מה חייבים ומתי.</p>
                  <div className="project-outcome">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    אפס הקלדות ידניות
                  </div>
                </div>
              </div>

            </div>
          </section>

          {/* Services */}
          <section className="services-section" id="services">
            <p className="section-eyebrow reveal">מה אני בונה</p>
            <h2 className="section-title reveal">ארבעה שירותים שמחזירים<br />לכם שעות בשבוע</h2>
            <p className="section-sub reveal">כל שירות פותר בעיה אחת. אפשר להתחיל מאחד ולהוסיף לאט לאט.</p>
            <div className="services-grid">
              {SERVICES.map((s,i) => (
                <div key={i} className="service-card reveal">
                  <div className="svc-icon-wrap">{SVC_ICONS[i]}</div>
                  <h3 className="service-title">{s.title}</h3>
                  <p className="service-desc">{s.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Impact */}
          <section className="impact-section">
            <p className="impact-eyebrow reveal">למה לעבוד איתי</p>
            <div className="impact-grid">
              <div className="impact-item reveal">
                <div className="impact-number"><AnimatedStat to={4} /><span className="accent">שבועות</span></div>
                <p className="impact-label">מרעיון לאוויר</p>
                <p className="impact-detail">בדרך כלל 4 שבועות מפגישה ראשונה ועד שהמערכת עובדת. לא חצי שנה.</p>
              </div>
              <div className="impact-item reveal">
                <div className="impact-number"><AnimatedStat to={80} suffix="%" /></div>
                <p className="impact-label">פחות עבודה ידנית</p>
                <p className="impact-detail">עסקים שעבדתי איתם מדווחים על חיסכון של 80% מהזמן שהלך על הקלדות והעתקות.</p>
              </div>
              <div className="impact-item reveal">
                <div className="impact-number"><AnimatedStat to={3} /><span className="accent">מוצרים</span></div>
                <p className="impact-label">בשטח כבר היום</p>
                <p className="impact-detail">שלוש מערכות פעילות לעסקי מזון ישראלים. לא הדגמות, לא קונספטים.</p>
              </div>
            </div>
          </section>

          {/* Contact */}
          <section className="contact-section" id="contact">
            <p className="contact-eyebrow">בואו נדבר</p>
            <h2 className="contact-title">
              תנו לי 30 דקות<br />
              ואני אגיד לכם אם זה מתאים לכם
            </h2>
            <p className="contact-sub">
              בלי מחויבות. ספרו לי איך אתם עובדים היום ואני אגיד לכם בדיוק מה אפשר לחסוך.
            </p>
            <div className="contact-btns">
              <a href={`https://wa.me/${WA}`} target="_blank" rel="noopener noreferrer" className="contact-btn contact-btn-wa">
                {WA_SVG} וואטסאפ
              </a>
              <a href={MEET} target="_blank" rel="noopener noreferrer" className="contact-btn contact-btn-meet">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                קביעת פגישה
              </a>
              <a href={`mailto:${EMAIL}`} className="contact-btn contact-btn-email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                מייל
              </a>
            </div>
          </section>

          {/* Footer */}
          <footer>
            <a href="/he" className="footer-logo">Omer Moran</a>
            <span className="footer-copy">© 2025 עומר מורן</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
