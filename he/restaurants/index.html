  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --bg2: #f3f2ee;
      --surface: #ffffff;
      --border: rgba(14,14,12,0.08);
      --border-mid: rgba(14,14,12,0.14);
      --gold: #456abf;
      --gold-rgb: 69,106,191;
      --gold-light: #456abf55;
      --gold-pale: #456abf12;
      --text: #0e0e0c;
      --text-dim: #5a5a54;
      --text-dimmer: #9a9a90;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
    }
    #root { position: relative; z-index: 1; }

    #cursor-glow {
      pointer-events: none; position: fixed; z-index: 9999;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb), 0.18) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      mix-blend-mode: multiply;
    }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 64px;
      transition: padding 0.4s, background 0.4s, box-shadow 0.4s;
    }
    nav.scrolled {
      padding: 16px 64px;
      background: rgba(250,249,246,0.92);

      -webkit-backdrop-filter: blur(20px);

    .nav-logo {

      font-size: 14px; font-weight: 600;

    .nav-links { display: flex; gap: 40px; list-style: none; flex-direction: row-reverse; }

    .nav-cta {

    .nav-cta:hover { background: var(--gold); }
    .nav-cta:hover::after { transform: translateX(-100%); }

    /* Buttons */
    .btn-primary {

    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); transform: translateX(100%); transition: transform 0.55s ease; }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(var(--gold-rgb),0.3); }
    .btn-primary:hover::after { transform: translateX(-100%); }
    .btn-ghost {

      transition: color 0.2s, gap 0.25s;

    /* Hero */

    .hero-eyebrow {

    .hero-title {

      font-size: clamp(38px, 5vw, 72px);

    /* Case Studies */

    .services-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .services-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .services-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 44px); font-weight: 900; color: #faf9f6; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 64px; }
    .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: rgba(255,255,255,0.06); }
    .service-card {
      background: rgba(255,255,255,0.03);

    .service-number {

    .service-title { font-family: 'Heebo', sans-serif; font-size: 22px; font-weight: 800; color: #faf9f6; margin-bottom: 14px; }
    .service-desc { font-size: 14px; line-height: 1.85; color: rgba(250,249,246,0.52); font-weight: 300; }

    /* Why Me */
    .why-section { background: var(--bg); padding: 100px 64px; position: relative; overflow: hidden; }
    .why-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }

    .why-grid::before { content: ''; position: absolute; top: 0; right: 33.33%; width: 1px; height: 100%; background: var(--border); }
    .why-grid::after { content: ''; position: absolute; top: 0; right: 66.66%; width: 1px; height: 100%; background: var(--border); }
    .why-item { padding: 0 56px; display: flex; flex-direction: column; align-items: flex-start; }
    .why-item:first-child { padding-right: 0; }
    .why-item:last-child { padding-left: 0; }
    .why-number {
      font-family: 'Space Grotesk', sans-serif;

    .why-number .accent { color: var(--gold); font-size: 0.5em; font-weight: 700; white-space: nowrap; align-self: center; }
    .why-label { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
    .why-detail { font-size: 14px; line-height: 1.75; color: var(--text-dim); font-weight: 300; max-width: 260px; }

    /* Contact */
    .contact-section { background: var(--text); padding: 120px 64px; position: relative; overflow: hidden; text-align: center; }
    .contact-section::before { content: ''; position: absolute; top: -300px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.08) 0%, transparent 70%); pointer-events: none; }
    .contact-eyebrow { display: inline-flex; align-items: center; justify-content: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .contact-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .contact-eyebrow::after { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .contact-title {
      font-family: 'Heebo', sans-serif;
      font-size: clamp(32px, 4vw, 60px); font-weight: 900;

    .contact-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .contact-btn {
      font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;

    .contact-btn:hover { transform: translateY(-3px); }
    .contact-btn-whatsapp {

    .contact-btn-whatsapp:hover { box-shadow: 0 12px 36px rgba(37,211,102,0.35); }
    .contact-btn-email {
      background: rgba(255,255,255,0.07); color: #faf9f6;

    .contact-btn-email:hover { background: rgba(255,255,255,0.13); }

    /* Footer */
    footer {
      background: var(--text); padding: 32px 64px;

    /* Reveal animations */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }

    /* Responsive */
    @media (max-width: 900px) {

      .why-item { padding: 0; }
      footer { padding: 24px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="cursor-glow"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const WA_NUMBER = "972505646450";
    const EMAIL = "omermoran14@gmail.com";
    const MEET_URL = "https://calendar.app.google/a1bvMsk7oMrTWYzQ9";

    function useNavScroll() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 60);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return scrolled;
    }

    function useScrollReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    function AnimatedStat({ to, suffix = '', prefix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting && !started.current) {
            started.current = true;
            const dur = 1400, start = performance.now();
            const tick = (now) => {
              const p = Math.min((now - start) / dur, 1);
              const ease = 1 - Math.pow(1 - p, 3);
              setVal(Math.round(ease * to));
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [to]);
      return <span ref={ref}>{prefix}{val}{suffix}</span>;
    }

    const MARQUEE_ITEMS = [

      'עיבוד חשבוניות', 'לוח בקרה יומי', 'Supabase', 'Railway',
    ];
