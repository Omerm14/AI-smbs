<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI למסעדות ומאפיות — עומר מורן</title>
  <meta name="description" content="מערכות AI שמנהלות הזמנות, עונות ללקוחות ומכינות את הצוות — בלי אקסלים, בלי פתקים, בלי טעויות." />
  <link rel="icon" type="image/jpeg" href="/uploads/photo-1777477389865.JPG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --bg2: #f3f2ee;
      --surface: #ffffff;
      --border: rgba(14,14,12,0.08);
      --border-mid: rgba(14,14,12,0.14);
      --gold: #456abf;
      --gold-rgb: 69,106,191;
      --gold-light: #456abf55;
      --gold-pale: #456abf12;
      --text: #0e0e0c;
      --text-dim: #5a5a54;
      --text-dimmer: #9a9a90;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
    }
    #root { position: relative; z-index: 1; }

    #cursor-glow {
      pointer-events: none; position: fixed; z-index: 9999;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb), 0.18) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      mix-blend-mode: multiply;
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 64px;
      transition: padding 0.4s, background 0.4s, box-shadow 0.4s;
    }
    nav.scrolled {
      padding: 16px 64px;
      background: rgba(250,249,246,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 var(--border);
    }
    .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--text);
      text-transform: uppercase; text-decoration: none;
    }
    .nav-links { display: flex; gap: 40px; list-style: none; flex-direction: row-reverse; }
    .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 0.04em; padding: 11px 26px;
      background: var(--text); color: var(--bg);
      text-decoration: none; display: inline-block;
      position: relative; overflow: hidden; transition: background 0.3s;
    }
    .nav-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: translateX(100%); transition: transform 0.5s ease; }
    .nav-cta:hover { background: var(--gold); }
    .nav-cta:hover::after { transform: translateX(-100%); }

    /* ── Buttons ── */
    .btn-primary {
      font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;
      padding: 16px 40px; background: var(--text); color: var(--bg);
      border: none; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      position: relative; overflow: hidden;
      transition: background 0.3s, transform 0.25s, box-shadow 0.25s;
    }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); transform: translateX(100%); transition: transform 0.55s ease; }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(var(--gold-rgb),0.3); }
    .btn-primary:hover::after { transform: translateX(-100%); }
    .btn-ghost {
      font-size: 14px; color: var(--text-dim);
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      transition: color 0.2s, gap 0.25s;
    }
    .btn-ghost:hover { color: var(--text); gap: 14px; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh; display: grid;
      grid-template-columns: 1fr 1fr; align-items: center;
      padding: 120px 64px 80px; gap: 80px;
      position: relative; overflow: hidden;
    }
    .hero-bg-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(var(--gold-rgb),0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--gold-rgb),0.045) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }
    .hero-glow {
      position: absolute; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb),0.13) 0%, transparent 65%);
      left: -8%; top: 50%; transform: translateY(-50%);
      pointer-events: none; filter: blur(40px);
      animation: floatGlow 7s ease-in-out infinite alternate;
    }
    @keyframes floatGlow { 0% { transform: translateY(-50%) scale(1); } 100% { transform: translateY(-56%) scale(1.1); } }
    .hero-content { position: relative; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 32px;
      opacity: 0; animation: fadeUp 0.6s 0.1s ease forwards;
    }
    .hero-eyebrow-line { display: inline-block; width: 32px; height: 1px; background: var(--gold); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .hero-title {
      font-family: 'Heebo', sans-serif; font-size: clamp(36px, 4vw, 62px);
      font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 28px;
      opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards;
    }
    .hero-title .accent { color: var(--gold); }
    .hero-sub {
      font-size: 18px; line-height: 1.8; color: var(--text-dim);
      max-width: 500px; margin-bottom: 52px; font-weight: 300;
      opacity: 0; animation: fadeUp 0.8s 0.55s ease forwards;
    }
    .hero-actions {
      display: flex; gap: 20px; align-items: center;
      opacity: 0; animation: fadeUp 0.8s 0.75s ease forwards;
    }

    /* ── Hero visual: WhatsApp mockup ── */
    .hero-visual {
      position: relative;
      opacity: 0; animation: fadeUp 1s 0.4s ease forwards;
    }
    .wa-mockup {
      background: #111827; border-radius: 20px;
      padding: 0; overflow: hidden;
      box-shadow: 0 32px 80px rgba(14,14,12,0.18), 0 0 0 1px rgba(255,255,255,0.06);
      max-width: 320px; margin: 0 auto;
    }
    .wa-header {
      background: #1f2937; padding: 14px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .wa-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #25d366; display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .wa-name { font-size: 14px; font-weight: 700; color: #f1f5f9; font-family: 'Heebo', sans-serif; }
    .wa-status { font-size: 11px; color: #25d366; margin-top: 1px; }
    .wa-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 220px; }
    .wa-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 12px;
      font-family: 'Heebo', sans-serif; font-size: 13px; line-height: 1.6; color: #f1f5f9;
      position: relative;
    }
    .wa-bubble.customer { background: #374151; align-self: flex-end; border-bottom-left-radius: 4px; }
    .wa-bubble.bot { background: #1a3a2a; border: 1px solid rgba(37,211,102,0.2); align-self: flex-start; border-bottom-right-radius: 4px; }
    .wa-bubble .wa-time { font-size: 10px; color: rgba(241,245,249,0.4); margin-top: 4px; text-align: left; display: block; }
    .wa-typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; align-self: flex-start; }
    .wa-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(241,245,249,0.3); animation: typingPulse 1.2s ease-in-out infinite; }
    .wa-dot:nth-child(2) { animation-delay: 0.2s; }
    .wa-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingPulse { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    .wa-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--gold); margin-top: 12px; padding: 6px 12px;
      border: 1px solid rgba(var(--gold-rgb),0.3); border-radius: 100px;
      background: rgba(var(--gold-rgb),0.08); width: fit-content; margin: 12px auto 0;
    }

    /* ── Marquee ── */
    .marquee-strip {
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 14px 0; background: var(--text); overflow: hidden;
    }
    .marquee-track { display: flex; animation: marqueeScroll 32s linear infinite; width: max-content; }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-item {
      display: inline-flex; align-items: center; gap: 20px; padding: 0 40px;
      white-space: nowrap; font-family: 'Heebo', sans-serif;
      font-size: 12px; font-weight: 700; color: rgba(250,249,246,0.45);
    }
    .marquee-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    /* ── Shared section styles ── */
    .section-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .section-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .section-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 46px); font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 20px; }
    .section-sub { font-size: 16px; line-height: 1.8; color: var(--text-dim); font-weight: 300; max-width: 540px; margin-bottom: 64px; }

    /* ── Problem ── */
    .problem-section { background: var(--bg2); padding: 100px 64px; position: relative; overflow: hidden; }
    .problem-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-mid); }
    .problem-card {
      background: var(--bg2); padding: 44px 36px;
      transition: background 0.3s; cursor: default;
    }
    .problem-card:hover { background: var(--surface); }
    .problem-icon { font-size: 40px; margin-bottom: 24px; display: block; animation: floatIcon 4s ease-in-out infinite alternate; }
    .problem-card:nth-child(2) .problem-icon { animation-delay: 0.8s; }
    .problem-card:nth-child(3) .problem-icon { animation-delay: 1.6s; }
    @keyframes floatIcon { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    .problem-title { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 14px; }
    .problem-desc { font-size: 14px; line-height: 1.85; color: var(--text-dim); font-weight: 300; }

    /* ── Projects (dark) ── */
    .projects-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .projects-section::before { content: ''; position: absolute; top: -300px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.07) 0%, transparent 70%); pointer-events: none; }
    .projects-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 24px; }
    .projects-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .projects-title { font-family: 'Heebo', sans-serif; font-size: clamp(28px, 3vw, 44px); font-weight: 900; color: #faf9f6; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 16px; }
    .projects-sub { font-size: 16px; color: rgba(250,249,246,0.45); font-weight: 300; margin-bottom: 60px; }
    .projects-grid { display: flex; flex-direction: column; gap: 40px; }
    .project-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      position: relative; overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .project-card:hover {
      border-color: rgba(var(--gold-rgb),0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .project-card::before {
      content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0; transition: opacity 0.4s;
    }
    .project-card:hover::before { opacity: 1; }
    .project-content { padding: 44px 40px; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.06); }
    .project-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 20px;
    }
    .project-tag::before { content: ''; display: inline-block; width: 14px; height: 1px; background: var(--gold); }
    .project-name { font-family: 'Heebo', sans-serif; font-size: 26px; font-weight: 900; color: #faf9f6; margin-bottom: 16px; letter-spacing: -0.01em; }
    .project-desc { font-size: 15px; line-height: 1.85; color: rgba(250,249,246,0.55); font-weight: 300; margin-bottom: 28px; flex: 1; }
    .project-outcome {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
      color: #25d366; padding: 8px 16px;
      background: rgba(37,211,102,0.08); border: 1px solid rgba(37,211,102,0.2);
      width: fit-content;
    }
    .project-visual { padding: 32px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.15); }

    /* ── Floory grid mockup ── */
    .floory-grid { width: 100%; font-family: 'Heebo', sans-serif; }
    .floory-grid-header {
      display: grid; grid-template-columns: 1.4fr repeat(6, 1fr);
      gap: 1px; margin-bottom: 1px;
    }
    .floory-grid-row {
      display: grid; grid-template-columns: 1.4fr repeat(6, 1fr);
      gap: 1px; margin-bottom: 1px; position: relative;
    }
    .floory-grid-row.ai-row { background: rgba(var(--gold-rgb),0.06); }
    .fg-cell {
      background: rgba(255,255,255,0.04); padding: 8px 10px;
      font-size: 11px; color: rgba(250,249,246,0.5); text-align: center;
    }
    .fg-cell.header { background: rgba(255,255,255,0.07); font-weight: 700; color: rgba(250,249,246,0.7); }
    .fg-cell.item-name { text-align: right; color: rgba(250,249,246,0.8); font-weight: 600; padding-right: 12px; }
    .fg-cell.qty { color: rgba(250,249,246,0.9); font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    .fg-cell.qty.ai { color: var(--gold); }
    .ai-row-badge {
      position: absolute; top: -10px; right: 0;
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--gold); background: rgba(var(--gold-rgb),0.15);
      border: 1px solid rgba(var(--gold-rgb),0.3); padding: 2px 8px;
    }
    .floory-footer {
      margin-top: 14px; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: rgba(var(--gold-rgb),0.06); border: 1px solid rgba(var(--gold-rgb),0.15);
    }
    .floory-footer-label { font-size: 11px; color: rgba(250,249,246,0.5); }
    .floory-footer-val { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--gold); }

    /* ── Lia chat mockup ── */
    .lia-chat { width: 100%; background: #0d1117; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
    .lia-chat-header {
      background: #161b22; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .lia-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #25d366;
      display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .lia-name { font-size: 13px; font-weight: 700; color: #f1f5f9; font-family: 'Heebo', sans-serif; }
    .lia-online { font-size: 10px; color: #25d366; }
    .lia-body { padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
    .lia-bubble {
      max-width: 85%; padding: 9px 13px; font-family: 'Heebo', sans-serif;
      font-size: 12px; line-height: 1.65; color: #f1f5f9; border-radius: 10px;
    }
    .lia-bubble.user { background: #2d333b; align-self: flex-end; border-bottom-left-radius: 3px; }
    .lia-bubble.bot { background: #0d2818; border: 1px solid rgba(37,211,102,0.18); align-self: flex-start; border-bottom-right-radius: 3px; }
    .lia-bubble .tick { color: #25d366; font-size: 10px; margin-right: 4px; }
    .lia-meta { font-size: 10px; color: rgba(241,245,249,0.35); margin-top: 3px; text-align: left; }

    /* ── Cashflow invoice mockup ── */
    .cf-card { width: 100%; background: #0d111a; border-radius: 12px; overflow: hidden; border: 1px solid #1e2535; }
    .cf-header {
      padding: 14px 18px; background: #111827;
      border-bottom: 1px solid #1e2535;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cf-title { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.08em; }
    .cf-count { font-size: 11px; color: #6366f1; font-weight: 600; background: rgba(99,102,241,0.1); padding: 3px 8px; border-radius: 4px; }
    .cf-row {
      padding: 12px 18px; border-bottom: 1px solid #1e2535;
      display: flex; align-items: center; gap: 10px;
    }
    .cf-row:last-child { border-bottom: none; }
    .cf-src-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .cf-src-gmail { background: rgba(239,68,68,0.15); }
    .cf-src-wa { background: rgba(37,211,102,0.12); }
    .cf-src-drive { background: rgba(99,102,241,0.12); }
    .cf-row-info { flex: 1; }
    .cf-supplier { font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; color: #e2e8f0; }
    .cf-due { font-size: 10px; color: #64748b; margin-top: 2px; }
    .cf-amount { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: #f1f5f9; margin-left: auto; }
    .cf-pill { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
    .cf-pill.paid { background: rgba(16,185,129,0.15); color: #10b981; }
    .cf-pill.pending { background: rgba(99,102,241,0.15); color: #818cf8; }
    .cf-pill.urgent { background: rgba(239,68,68,0.15); color: #ef4444; }

    /* ── Services ── */
    .services-section { background: var(--bg); padding: 100px 64px; position: relative; overflow: hidden; }
    .services-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 0; }
    .service-card {
      background: var(--surface); border: 1px solid var(--border-mid); padding: 40px 36px;
      position: relative; transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      cursor: default;
    }
    .service-card:hover { border-color: rgba(var(--gold-rgb),0.3); box-shadow: 0 12px 40px rgba(var(--gold-rgb),0.08); transform: translateY(-3px); }
    .service-icon { font-size: 36px; margin-bottom: 20px; display: block; }
    .service-title { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    .service-desc { font-size: 14px; line-height: 1.85; color: var(--text-dim); font-weight: 300; }

    /* ── Impact (Why Me) ── */

      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    function AnimatedStat({ to, suffix = '', prefix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting && !started.current) {
            started.current = true;
            const dur = 1400, start = performance.now();
            const tick = (now) => {
              const p = Math.min((now - start) / dur, 1);
              const ease = 1 - Math.pow(1 - p, 3);
              setVal(Math.round(ease * to));
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [to]);
      return <span ref={ref}>{prefix}{val}{suffix}</span>;
    }

                </div>
                <div className="project-visual">
                  <FlooryGridMockup />
                </div>
              </div>

              {/* Lia */}
              <div className="project-card reveal">
                <div className="project-content">
                  <p className="project-tag">שירות לקוחות AI · מסעדות</p>
                  <h3 className="project-name">ליה — אורבן בייקרי</h3>
                  <p className="project-desc">
                    בוט וואטסאפ שעונה על שאלות לקוחות 24/7 — בעברית ואנגלית. שעות פתיחה, תפריט, הזמנות, כשרות. רק שאלה שהיא לא יודעת לענות עליה — מגיעה למנהל.
                  </p>
                  <div className="project-outcome">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    עונה תוך 30 שניות, גם בשבת בלילה
                  </div>
                </div>
                <div className="project-visual">
                  <LiaChatMockup />
                </div>
              </div>

              {/* Cashflow */}
              <div className="project-card reveal">
                <div className="project-content">
                  <p className="project-tag">ניהול פיננסי · עסקים</p>
                  <h3 className="project-name">Cashflow</h3>
                  <p className="project-desc">
                    כל חשבונית שמגיעה — ב-Gmail, בוואטסאפ, ב-Drive — נקראת אוטומטית ונכנסת ללוח בקרה אחד. תמיד יודעים מה חייבים, למי, ומתי.
                  </p>
                  <div className="project-outcome">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    אפס הקלדות ידניות של חשבוניות
                  </div>
                </div>
                <div className="project-visual">
                  <CashflowMockup />
                </div>
              </div>
            </div>
          </section>

          {/* Services */}
          <section className="services-section" id="services">
            <p className="section-eyebrow reveal">מה אני בונה</p>
            <h2 className="section-title reveal">ארבעה שירותים שמחזירים<br />לכם שעות כל שבוע</h2>
            <p className="section-sub reveal">כל שירות פותר בעיה ספציפית. אפשר להתחיל מאחד ולהוסיף לפי הצורך.</p>
            <div className="services-grid">
              {SERVICES.map((s, i) => (
                <div key={i} className="service-card reveal">
                  <span className="service-icon">{s.icon}</span>
                  <h3 className="service-title">{s.title}</h3>
                  <p className="service-desc">{s.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Impact */}
          <section className="impact-section">
            <p className="impact-eyebrow reveal">למה לעבוד איתי</p>
            <div className="impact-grid">
              <div className="impact-item reveal">
                <div className="impact-number">
                  <AnimatedStat to={4} /><span className="accent">שבועות</span>
                </div>
                <p className="impact-label">מרעיון לאוויר</p>
                <p className="impact-detail">4 שבועות מפגישה ראשונה עד מוצר עובד בשטח — לא 6 חודשים של פיתוח.</p>
              </div>
              <div className="impact-item reveal">
                <div className="impact-number">
                  <AnimatedStat to={80} suffix="%" />
                </div>
                <p className="impact-label">פחות עבודה ידנית</p>
                <p className="impact-detail">הלקוחות שלי חוסכים בממוצע 80% מהזמן שהוקדש להעתקות ידניות.</p>
              </div>
              <div className="impact-item reveal">
                <div className="impact-number">
                  <AnimatedStat to={3} /><span className="accent">מוצרים</span>
                </div>
                <p className="impact-label">חיים בשטח</p>
                <p className="impact-detail">שלושה מוצרי AI לעסקי מזון ישראלים כבר פועלים — לא קונספטים, מערכות אמיתיות.</p>
              </div>
            </div>
          </section>

          {/* Contact */}
          <section className="contact-section" id="contact">
            <p className="contact-eyebrow">בואו נדבר</p>
            <h2 className="contact-title">
              תנו לי 30 דקות —<br />
              ואני אראה לכם אם זה מתאים לכם
            </h2>
            <p className="contact-sub">
              אין מחויבות. ספרו לי איך אתם עובדים היום ואני אגיד לכם בדיוק מה אפשר לחסוך.
            </p>
            <div className="contact-btns">
              <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" className="contact-btn contact-btn-whatsapp">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                וואטסאפ
              </a>
              <a href={MEET_URL} target="_blank" rel="noopener noreferrer" className="contact-btn contact-btn-meet">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                קביעת פגישה
              </a>
              <a href={`mailto:${EMAIL}`} className="contact-btn contact-btn-email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                מייל
              </a>
            </div>
          </section>

          {/* Footer */}
          <footer>
            <a href="/he" className="footer-logo">Omer Moran</a>
            <span className="footer-copy">© 2025 עומר מורן</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
