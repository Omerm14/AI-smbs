    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111110;
      --panel: #1a1a18;
      --panel2: #222220;
      --panel3: #2a2a27;
      --border: rgba(255,255,255,0.07);
      --border-mid: rgba(255,255,255,0.12);
      --accent: #456abf;
      --accent-rgb: 69,106,191;
      --text: #f0efe9;
      --text-dim: rgba(240,239,233,0.55);
      --text-dimmer: rgba(240,239,233,0.3);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.1);
      --success: #2a9d5c;
      --error: #e05a5a;
      --warning: #e09a2a;
    }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .hdr { position: fixed; top: 0; left: 0; right: 0; height: 54px; z-index: 200; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
    .hdr-brand { display: flex; align-items: center; gap: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }
    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .hdr-center { flex: 1; display: flex; justify-content: center; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dimmer); padding: 4px 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 100px; }
    .sdot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dimmer); flex-shrink: 0; transition: all 0.3s; }
    .sdot.ok    { background: var(--success); box-shadow: 0 0 5px var(--success); }
    .sdot.dirty { background: var(--warning); box-shadow: 0 0 5px var(--warning); }
    .sdot.pub   { background: var(--accent); animation: blink .9s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hdr-right { display: flex; align-items: center; gap: 8px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 8px 16px; border: none; cursor: pointer; transition: all .2s; white-space: nowrap; border-radius: 4px; }
    .btn:disabled { opacity: .45; pointer-events: none; }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border-mid); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .btn-accent { background: var(--accent); color: #fff; border: 1px solid transparent; }
    .btn-accent:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 5px 18px rgba(var(--accent-rgb),.35); }
    .btn-danger { background: transparent; color: var(--error); border: 1px solid rgba(224,90,90,.3); }
    .btn-danger:hover { background: rgba(224,90,90,.1); }
    .preview-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); text-decoration: none; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 4px; padding: 6px 11px; transition: all .15s; }
    .preview-link:hover { color: var(--text); background: rgba(255,255,255,.08); }

    /* ── Layout ── */
    .layout { display: flex; height: 100vh; padding-top: 54px; }

    /* ── Sidebar ── */
    .sb { width: 200px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .sb-sec { padding: 6px 0; }
    .sb-sec + .sb-sec { border-top: 1px solid var(--border); }
    .sb-lbl { font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dimmer); padding: 10px 16px 5px; }
    .nav-it { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: color .15s, background .15s; user-select: none; border-left: 2px solid transparent; }
    .nav-it:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .nav-it.on { color: var(--text); background: rgba(var(--accent-rgb),.1); border-left-color: var(--accent); }
    .nav-it svg { opacity: .55; flex-shrink: 0; }
    .nav-it.on svg { opacity: 1; }

    /* ── Main ── */
    .main { flex: 1; overflow-y: auto; background: var(--bg); }
    .panel { max-width: 740px; margin: 0 auto; padding: 40px 48px 100px; }
    .p-title { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; margin-bottom: 5px; }
    .p-desc { font-size: 13.5px; color: var(--text-dim); line-height: 1.65; margin-bottom: 36px; }

    /* ── Fields ── */
    .fg { margin-bottom: 32px; }
    .fg-title { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid rgba(var(--accent-rgb),.18); }
    .f { margin-bottom: 16px; }
    .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .f-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .lbl { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
    .hint { font-size: 11px; color: var(--text-dimmer); margin-bottom: 5px; line-height: 1.5; }
    .inp { width: 100%; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; border-radius: 5px; outline: none; transition: border-color .2s, background .2s; }
    .inp:focus { border-color: rgba(var(--accent-rgb),.6); background: rgba(var(--accent-rgb),.05); }
    .inp[disabled] { opacity: .4; cursor: not-allowed; }
    textarea.inp { resize: vertical; min-height: 76px; line-height: 1.6; }
    .color-row { display: flex; align-items: center; gap: 9px; }
    .cswatch { width: 38px; height: 36px; border: 1px solid var(--input-border); border-radius: 5px; cursor: pointer; padding: 3px; background: transparent; }
    .cswatch::-webkit-color-swatch-wrapper { padding: 0; }
    .cswatch::-webkit-color-swatch { border: none; border-radius: 3px; }

    /* ── Cards ── */
    .clist { display: flex; flex-direction: column; gap: 9px; }
    .citem { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
    .chead { display: flex; align-items: center; gap: 11px; padding: 12px 14px; cursor: pointer; user-select: none; transition: background .15s; }
    .chead:hover { background: rgba(255,255,255,.03); }
    .cnum { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .1em; min-width: 26px; }
    .cname { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
    .chev { color: var(--text-dimmer); transition: transform .2s; flex-shrink: 0; }
    .citem.open .chev { transform: rotate(180deg); }
    .cbody { padding: 14px; border-top: 1px solid var(--border); display: none; }
    .citem.open .cbody { display: block; }

    /* ── List editor (marquee, companies, paragraphs) ── */
    .list-rows { display: flex; flex-direction: column; gap: 6px; }
    .list-row { display: flex; gap: 7px; align-items: flex-start; }
    .list-row .inp { flex: 1; }
    .btn-icon { background: transparent; border: 1px solid var(--border); color: var(--text-dimmer); width: 32px; height: 32px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; margin-top: 1px; }
    .btn-icon:hover { color: var(--error); border-color: rgba(224,90,90,.4); background: rgba(224,90,90,.06); }
    .btn-add { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 1px dashed var(--border-mid); color: var(--text-dim); font-size: 12px; padding: 7px 13px; border-radius: 5px; cursor: pointer; margin-top: 8px; transition: all .15s; }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toggle ── */
    .tog-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
    .tog { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .tog input { opacity: 0; width: 0; height: 0; position: absolute; }
    .tog-tr { position: absolute; cursor: pointer; inset: 0; background: var(--panel3); border: 1px solid var(--input-border); border-radius: 20px; transition: .2s; }
    .tog input:checked + .tog-tr { background: var(--accent); border-color: var(--accent); }
    .tog-th { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: .2s; pointer-events: none; }
    .tog input:checked ~ .tog-th { transform: translateX(16px); }

    /* ── Settings box ── */
    .sbox { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 22px; margin-bottom: 16px; }
    .sbox-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
    .sbox-actions { display: flex; gap: 9px; margin-top: 16px; flex-wrap: wrap; }

    /* ── Divider ── */
    hr.div { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Setup ── */
    .setup-wrap { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 40px 24px; }
    .setup-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 44px; max-width: 460px; width: 100%; }
    .setup-logo { display: flex; align-items: center; gap: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 24px; }
    .setup-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .setup-sub { font-size: 13.5px; color: var(--text-dim); line-height: 1.65; margin-bottom: 28px; }
    .setup-step { display: flex; gap: 13px; margin-bottom: 12px; background: rgba(255,255,255,.03); border-radius: 7px; padding: 12px 14px; }
    .setup-step-n { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); font-size: 13px; min-width: 16px; }
    .setup-step-t { font-size: 13px; color: var(--text-dim); line-height: 1.65; }
    .setup-step-t a { color: var(--accent); text-decoration: none; }
    .setup-step-t a:hover { text-decoration: underline; }

    /* ── Loading ── */
    .load-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 100%; padding: 80px; color: var(--text-dim); font-size: 13.5px; }
    .spin { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.08); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #tw { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
    .toast { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 12px 16px; display: flex; align-items: flex-start; gap: 11px; box-shadow: 0 6px 28px rgba(0,0,0,.5); pointer-events: all; animation: tIn .22s ease; max-width: 320px; }
    @keyframes tIn { from { transform: translateX(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast.success { border-color: rgba(42,157,92,.35); }
    .toast.error   { border-color: rgba(224,90,90,.35); }
    .toast.info    { border-color: rgba(var(--accent-rgb),.35); }
    .t-ic { font-size: 15px; line-height: 1; margin-top: 1px; }
    .t-ti { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .t-su { font-size: 11px; color: var(--text-dimmer); margin-top: 2px; line-height: 1.4; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.07); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.14); }
  </style>
</head>

  if(h.includes('/*CONTENT-BEGIN*/')) return h.replace(/(\/\*CONTENT-BEGIN\*\/)[\s\S]*?(\/\*CONTENT-END\*\/)/,`$1${JSON.stringify(c,null,2)}$2`);
  const mk='} /*EDITMODE-END*/;', i=h.indexOf(mk);
  return i<0?h:h.slice(0,i+mk.length)+`\n\nconst SITE_CONTENT = /*CONTENT-BEGIN*/${JSON.stringify(c,null,2)}/*CONTENT-END*/;`+h.slice(i+mk.length);
};

// ═══════════════════════════════════════════════
//  GITHUB
// ═══════════════════════════════════════════════
async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com${path}`,{...opts,headers:{'Authorization':`Bearer ${S.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json',...(opts.headers||{})}});
  let d; try{d=await r.json()}catch{d={}}
  if(!r.ok) throw new Error(d.message||`GitHub ${r.status}`);
  return d;
}
async function loadFile(){
  const d=await gh(`/repos/${REPO}/contents/${FILE_EN}?ref=${encodeURIComponent(S.branch)}`);
  S.sha=d.sha; S.raw=decodeURIComponent(escape(atob(d.content.replace(/\s/g,'')))); return S.raw;
}
async function commitFile(html,msg){
  const d=await gh(`/repos/${REPO}/contents/${FILE_EN}`,{method:'PUT',body:JSON.stringify({message:msg,content:btoa(unescape(encodeURIComponent(html))),sha:S.sha,branch:S.branch})});
  S.sha=d.content.sha; S.raw=html;
}

//  TOAST
// ═══════════════════════════════════════════════
function toast(type,title,sub='',ms=4000){
  const ic={success:'✓',error:'✕',info:'→'}[type]||'·';
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<div class="t-ic">${ic}</div><div><div class="t-ti">${esc(title)}</div>${sub?`<div class="t-su">${esc(sub)}</div>`:''}</div>`;
  document.getElementById('tw').appendChild(el);
  setTimeout(()=>el.remove(),ms);
}

const esc = s => s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone = o => JSON.parse(JSON.stringify(o));
function setDirty(v=true){
  S.dirty=v;
  const d=document.getElementById('sdot'),t=document.getElementById('stxt');
  if(!d)return;
  d.className=v?'sdot dirty':'sdot ok';
  if(t) t.textContent=v?'Unsaved changes':'Published';
}

function accordion(){
  document.querySelectorAll('.chead').forEach(h=>h.onclick=()=>h.closest('.citem').classList.toggle('open'));
}
function bindArr(section,cb){
  document.querySelectorAll(`[data-s="${section}"]`).forEach(el=>{
    el.addEventListener('input',()=>{
      const i=+el.dataset.i,f=el.dataset.f;
      S.content[section][i][f]=el.value;
      cb?.(el,i,f,el.value);
      setDirty();
    });
  });
}
function bindChecks(section){
  document.querySelectorAll(`[data-s="${section}"][type="checkbox"]`).forEach(el=>{
    el.onchange=()=>{S.content[section][+el.dataset.i][el.dataset.f]=el.checked;setDirty();};
  });
}
function bindKey(id,obj,key){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('input',()=>{obj[key]=el.value;setDirty();});
}
function listEditor(items,opts={}){
  const {onchange,addLabel='Add item',textarea=false}=opts;
  const rows=items.map((v,i)=>`
    <div class="list-row" data-li="${i}">
      ${textarea
        ? `<textarea class="inp li-inp" data-li-i="${i}" style="min-height:60px">${esc(v)}</textarea>`
        : `<input class="inp li-inp" data-li-i="${i}" value="${esc(v)}" />`}
      <button class="btn-icon li-del" data-li-i="${i}" title="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>`).join('');
  return `<div class="list-rows" id="list-rows">${rows}</div>
    <button class="btn-add list-add"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${addLabel}</button>`;
}
function bindListEditor(items,opts={}){
  const {onchange,addVal='New item',textarea=false}=opts;
  document.querySelectorAll('.li-inp').forEach(el=>{
    el.addEventListener('input',()=>{items[+el.dataset.liI]=el.value;setDirty();onchange?.();});
  });
  document.querySelectorAll('.li-del').forEach(btn=>{
    btn.onclick=()=>{items.splice(+btn.dataset.liI,1);setDirty();onchange?.();};
  });
  document.querySelector('.list-add').onclick=()=>{items.push(addVal);setDirty();onchange?.();};
}

// ═══════════════════════════════════════════════
function tSettings(){
  document.getElementById('mn').innerHTML=`<div class="panel">
    <div class="p-title">Settings</div>
    <div class="p-desc">GitHub connection. Your token is stored only in this browser.</div>
    <div class="sbox">
      <div class="sbox-title">GitHub Connection</div>
      <div class="f"><label class="lbl">Personal Access Token</label><input id="set-tok" type="password" class="inp" value="${esc(S.token)}" autocomplete="off" /></div>
      <div class="f"><label class="lbl">Branch</label><input id="set-br" type="text" class="inp" value="${esc(S.branch)}" /></div>
      <div class="sbox-actions">
        <button class="btn btn-accent" id="set-save">Save &amp; Reconnect</button>
        <button class="btn btn-danger" id="set-disc">Disconnect</button>
      </div>
    </div>
    <div class="sbox">
      <div class="sbox-title">Repository Info</div>
      <div class="f-row">
        <div class="f"><label class="lbl">Repository</label><input class="inp" value="${esc(REPO)}" disabled /></div>
        <div class="f"><label class="lbl">File</label><input class="inp" value="${esc(FILE_EN)}" disabled /></div>
      </div>
    </div>
  </div>`;
  document.getElementById('set-save').onclick=async()=>{
    const tok=document.getElementById('set-tok').value.trim(),br=document.getElementById('set-br').value.trim()||'claude/AI-smbs-main';
    if(!tok){toast('error','Token required');return;}
    S.token=tok;S.branch=br;localStorage.setItem('ed_token',tok);localStorage.setItem('ed_branch',br);
    renderLoad('Reconnecting…');
    try{await boot();toast('success','Saved','Reconnected to GitHub');}catch(e){toast('error','Failed',e.message);renderSetup();}
  };
  document.getElementById('set-disc').onclick=()=>{
    localStorage.removeItem('ed_token');localStorage.removeItem('ed_branch');S.token='';renderSetup();
  };
}

// ═══════════════════════════════════════════════
//  PUBLISH
// ═══════════════════════════════════════════════
async function doPublish(){
  if(!S.sha){toast('error','Not connected','Reload first');return;}
  const btn=document.getElementById('pub-btn'),dot=document.getElementById('sdot'),txt=document.getElementById('stxt');
  btn.disabled=true;btn.textContent='Publishing…';
  if(dot){dot.className='sdot pub';}if(txt)txt.textContent='Publishing…';
  try{
    let h=applyTweaks(S.raw,S.tweaks);
    h=applyContent(h,S.content);
    await commitFile(h,'Update website content via editor');
    setDirty(false);
    toast('success','Published!','Vercel is deploying (~30s)',6000);
  }catch(e){
    toast('error','Publish failed',e.message);
    if(dot)dot.className='sdot ok';if(txt)txt.textContent='Connected';
  }finally{
    btn.disabled=false;
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Publish';
  }
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
(async()=>{
  if(!S.token){renderSetup();return;}
  renderLoad();
  try{await boot();}catch(e){toast('error','Auto-connect failed',e.message);renderSetup();}
})();
</script>
