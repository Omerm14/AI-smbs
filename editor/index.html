<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Editor — Omer Moran</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111110;
      --panel: #1a1a18;
      --panel2: #222220;
      --panel3: #2a2a27;
      --border: rgba(255,255,255,0.07);
      --border-mid: rgba(255,255,255,0.12);
      --accent: #456abf;
      --accent-rgb: 69,106,191;
      --text: #f0efe9;
      --text-dim: rgba(240,239,233,0.55);
      --text-dimmer: rgba(240,239,233,0.3);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.1);
      --success: #2a9d5c;
      --error: #e05a5a;
      --warning: #e09a2a;
    }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 200;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .status-pill { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dimmer); padding: 5px 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 100px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dimmer); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.dirty { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-dot.publishing { background: var(--accent); animation: blink 0.9s infinite; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; border: none; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border-mid); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .btn-accent { background: var(--accent); color: #fff; border: 1px solid transparent; }
    .btn-accent:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(var(--accent-rgb),0.35); }
    .btn-danger { background: transparent; color: var(--error); border: 1px solid rgba(224,90,90,0.3); }
    .btn-danger:hover { background: rgba(224,90,90,0.1); }

    /* ── Layout ── */
    .layout { display: flex; height: 100vh; padding-top: 56px; }

    /* ── Sidebar ── */
    .sidebar { width: 210px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-section { padding: 8px 0; }
    .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }
    .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dimmer); padding: 10px 18px 6px; }
    .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 18px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: color 0.15s, background 0.15s; user-select: none; border-left: 2px solid transparent; }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-item.active { color: var(--text); background: rgba(var(--accent-rgb),0.1); border-left-color: var(--accent); }
    .nav-item svg { opacity: 0.6; flex-shrink: 0; }
    .nav-item.active svg { opacity: 1; }

    /* ── Main ── */
    .main { flex: 1; overflow-y: auto; background: var(--bg); }
    .panel { max-width: 760px; margin: 0 auto; padding: 44px 52px 100px; }
    .panel-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .panel-desc { font-size: 14px; color: var(--text-dim); line-height: 1.65; margin-bottom: 40px; }

    /* ── Fields ── */
    .field-group { margin-bottom: 36px; }
    .field-group-title { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(var(--accent-rgb),0.18); }
    .field { margin-bottom: 18px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .field-hint { font-size: 11px; color: var(--text-dimmer); margin-bottom: 6px; line-height: 1.5; }
    .field-input {
      width: 100%; padding: 9px 13px;
      background: var(--input-bg); border: 1px solid var(--input-border);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13.5px;
      border-radius: 6px; outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .field-input:focus { border-color: rgba(var(--accent-rgb),0.6); background: rgba(var(--accent-rgb),0.05); }
    .field-input[disabled] { opacity: 0.45; cursor: not-allowed; }
    textarea.field-input { resize: vertical; min-height: 82px; line-height: 1.6; }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-swatch { width: 40px; height: 38px; border: 1px solid var(--input-border); border-radius: 6px; cursor: pointer; padding: 3px; background: transparent; }
    .color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch::-webkit-color-swatch { border: none; border-radius: 4px; }

    /* ── Cards (expandable items) ── */
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .card-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; user-select: none; transition: background 0.15s; }
    .card-head:hover { background: rgba(255,255,255,0.03); }
    .card-num { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; min-width: 28px; }
    .card-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
    .card-chevron { color: var(--text-dimmer); transition: transform 0.2s; flex-shrink: 0; }
    .card-item.open .card-chevron { transform: rotate(180deg); }
    .card-body { padding: 16px; border-top: 1px solid var(--border); display: none; }
    .card-item.open .card-body { display: block; }

    /* ── Marquee rows ── */
    .marquee-rows { display: flex; flex-direction: column; gap: 7px; }
    .marquee-row { display: flex; gap: 8px; align-items: center; }
    .marquee-row .field-input { flex: 1; }
    .btn-icon { background: transparent; border: 1px solid var(--border); color: var(--text-dimmer); width: 34px; height: 34px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
    .btn-icon:hover { color: var(--error); border-color: rgba(224,90,90,0.4); background: rgba(224,90,90,0.06); }
    .btn-add { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px dashed var(--border-mid); color: var(--text-dim); font-size: 12px; padding: 7px 14px; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: all 0.15s; }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toggle ── */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .toggle { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track { position: absolute; cursor: pointer; inset: 0; background: var(--panel3); border: 1px solid var(--input-border); border-radius: 21px; transition: 0.2s; }
    .toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
    .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; background: white; border-radius: 50%; transition: 0.2s; pointer-events: none; }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(17px); }

    /* ── Settings ── */
    .settings-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 18px; }
    .settings-card-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 18px; }
    .settings-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

    /* ── Setup screen ── */
    .setup-wrap { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 40px 24px; }
    .setup-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 48px; max-width: 480px; width: 100%; }
    .setup-logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 28px; }
    .setup-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .setup-sub { font-size: 14px; color: var(--text-dim); line-height: 1.65; margin-bottom: 32px; }
    .setup-step { display: flex; gap: 14px; margin-bottom: 14px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 14px 16px; }
    .setup-step-num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); font-size: 13px; min-width: 18px; }
    .setup-step-text { font-size: 13px; color: var(--text-dim); line-height: 1.65; }
    .setup-step-text a { color: var(--accent); text-decoration: none; }
    .setup-step-text a:hover { text-decoration: underline; }
    .setup-form { margin-top: 28px; }
    .setup-connect { width: 100%; justify-content: center; padding: 13px; font-size: 12px; margin-top: 20px; }

    /* ── Loading ── */
    .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 100%; padding: 80px; color: var(--text-dim); font-size: 14px; }
    .spinner { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: all; animation: toastIn 0.25s ease; max-width: 340px; }
    @keyframes toastIn { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast.success { border-color: rgba(42,157,92,0.35); }
    .toast.error { border-color: rgba(224,90,90,0.35); }
    .toast.info { border-color: rgba(var(--accent-rgb),0.35); }
    .toast-icon { font-size: 16px; line-height: 1; margin-top: 1px; }
    .toast-body { flex: 1; }
    .toast-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .toast-sub { font-size: 11px; color: var(--text-dimmer); margin-top: 3px; line-height: 1.4; }

    /* ── Preview banner ── */
    .preview-link { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); text-decoration: none; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; transition: all 0.15s; }
    .preview-link:hover { color: var(--text); background: rgba(255,255,255,0.08); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .info-box { background: rgba(var(--accent-rgb),0.07); border: 1px solid rgba(var(--accent-rgb),0.2); border-radius: 8px; padding: 14px 18px; font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 24px; }
  </style>
</head>

// ════════════════════════════════════════════════════
//  PARSE / RECONSTRUCT
// ════════════════════════════════════════════════════
function parseTweaks(html) {
  const m = html.match(/\/\*EDITMODE-BEGIN\*\/([\s\S]*?)\/\*EDITMODE-END\*\//);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch(e) { return null; }
}

function parseSiteContent(html) {
  const m = html.match(/\/\*CONTENT-BEGIN\*\/([\s\S]*?)\/\*CONTENT-END\*\//);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch(e) { return null; }
}

function applyTweaks(html, tweaks) {
  return html.replace(
    /(\/\*EDITMODE-BEGIN\*\/)[\s\S]*?(\/\*EDITMODE-END\*\/)/,
    `$1${JSON.stringify(tweaks, null, 2)}$2`
  );
}

function applySiteContent(html, content) {
  if (html.includes('/*CONTENT-BEGIN*/')) {
    return html.replace(
      /(\/\*CONTENT-BEGIN\*\/)[\s\S]*?(\/\*CONTENT-END\*\/)/,
      `$1${JSON.stringify(content, null, 2)}$2`
    );
  }
  // Insert after TWEAK_DEFAULTS if not present yet
  const marker = '} /*EDITMODE-END*/;';
  const idx = html.indexOf(marker);
  if (idx === -1) return html;
  const insert = `\n\nconst SITE_CONTENT = /*CONTENT-BEGIN*/${JSON.stringify(content, null, 2)}/*CONTENT-END*/;`;
  return html.slice(0, idx + marker.length) + insert + html.slice(idx + marker.length);
}

// ════════════════════════════════════════════════════
//  GITHUB API
// ════════════════════════════════════════════════════
async function ghFetch(path, opts = {}) {
  const res = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${S.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  let data;
  try { data = await res.json(); } catch(e) { data = {}; }
  if (!res.ok) throw new Error(data.message || `GitHub ${res.status}`);
  return data;
}

async function loadFile() {
  const data = await ghFetch(`/repos/${REPO}/contents/${FILE_EN}?ref=${encodeURIComponent(S.branch)}`);
  S.fileSha = data.sha;
  S.rawFile = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
  return S.rawFile;
}

async function commitFile(html, message) {
  const encoded = btoa(unescape(encodeURIComponent(html)));
  const data = await ghFetch(`/repos/${REPO}/contents/${FILE_EN}`, {
    method: 'PUT',
    body: JSON.stringify({ message, content: encoded, sha: S.fileSha, branch: S.branch })
  });
  S.fileSha = data.content.sha;
  S.rawFile = html;
}

// ════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════
function toast(type, title, sub = '', duration = 4000) {
  const icons = { success: '✓', error: '✕', info: '→' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="toast-icon">${icons[type]||'·'}</div><div class="toast-body"><div class="toast-title">${esc(title)}</div>${sub ? `<div class="toast-sub">${esc(sub)}</div>` : ''}</div>`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

// ════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setDirty(val = true) {
  S.dirty = val;
  const dot = document.getElementById('hdr-dot');
  const txt = document.getElementById('hdr-txt');
  if (!dot || !txt) return;
  if (val) { dot.className = 'status-dot dirty'; txt.textContent = 'Unsaved changes'; }
  else      { dot.className = 'status-dot connected'; txt.textContent = 'Published'; }
}

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

            Connect &amp; Load Content
          </button>
        </div>
      </div>
    </div>
    </div></div>`;

  document.getElementById('s-connect').addEventListener('click', async () => {
    const token  = document.getElementById('s-token').value.trim();

async function boot() {
  const html = await loadFile();
  S.tweaks  = parseTweaks(html)       || deepClone(DEFAULT_TWEAKS);
  S.content = parseSiteContent(html)  || deepClone(DEFAULT_CONTENT);
  renderEditor();
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const contentTabs = TABS.filter(t => t.id !== 'settings');
  const settingsTab = TABS.find(t => t.id === 'settings');
  sb.innerHTML = `
    <div class="sidebar-section">
      <div class="sidebar-label">Content</div>
      ${contentTabs.map(t => navItem(t)).join('')}
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Config</div>
      ${navItem(settingsTab)}
    </div>`;
  sb.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => { S.tab = el.dataset.tab; buildSidebar(); showTab(S.tab); });
  });
}

function navItem(t) {
  const active = S.tab === t.id ? ' active' : '';
  return `<div class="nav-item${active}" data-tab="${t.id}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">${t.icon}</svg>
    <span>${t.label}</span>
  </div>`;
}

function showTab(id) {
  const fns = {
    basics: tabBasics, services: tabServices, background: tabBackground,
    process: tabProcess, testimonials: tabTestimonials, marquee: tabMarquee, settings: tabSettings
  };
  (fns[id] || tabBasics)();
}

function bindMarqueeEvents() {

        <div class="field">
          <label class="field-label">File being edited</label>
          <input type="text" class="field-input" value="${esc(FILE_EN)}" disabled />
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById('set-save').addEventListener('click', async () => {
    const tok = document.getElementById('set-token').value.trim();
    const br  = document.getElementById('set-branch').value.trim() || 'main';
    if (!tok) { toast('error', 'Token required'); return; }
    S.token = tok; S.branch = br;
    localStorage.setItem('ed_token', tok); localStorage.setItem('ed_branch', br);
    renderLoading('Reconnecting…');
    try { await boot(); toast('success', 'Settings saved', 'Reconnected to GitHub'); }
    catch(e) { toast('error', 'Connection failed', e.message); renderSetup(); }
  });

  document.getElementById('set-disconnect').addEventListener('click', () => {
    localStorage.removeItem('ed_token'); localStorage.removeItem('ed_branch');
    S.token = ''; renderSetup();
  });
}

// ════════════════════════════════════════════════════
//  SHARED UI HELPERS
// ════════════════════════════════════════════════════
function initAccordion() {
  document.querySelectorAll('.card-head').forEach(head => {
    head.addEventListener('click', () => head.closest('.card-item').classList.toggle('open'));
  });
}

function initArrayInputs(section, onUpdate) {
  document.querySelectorAll(`[data-s="${section}"]`).forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.dataset.i, f = el.dataset.f;
      S.content[section][i][f] = el.value;
      if (onUpdate) onUpdate(el, i, f, el.value);
      setDirty();
    });
  });
}

// ════════════════════════════════════════════════════
//  PUBLISH
// ════════════════════════════════════════════════════
async function doPublish() {
  if (!S.fileSha) { toast('error', 'Not connected', 'Reload the editor first'); return; }
  const btn = document.getElementById('pub-btn');
  const dot = document.getElementById('hdr-dot');
  const txt = document.getElementById('hdr-txt');
  btn.disabled = true; btn.textContent = 'Publishing…';
  if (dot) { dot.className = 'status-dot publishing'; }
  if (txt) txt.textContent = 'Publishing…';
  try {
    let html = S.rawFile;
    html = applyTweaks(html, S.tweaks);
    html = applySiteContent(html, S.content);
    await commitFile(html, 'Update website content via editor');
    setDirty(false);
    toast('success', 'Published!', 'Vercel is deploying your changes (~30 seconds)', 6000);
  } catch(e) {
    toast('error', 'Publish failed', e.message);
    if (dot) { dot.className = 'status-dot connected'; }
    if (txt) txt.textContent = 'Connected';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Publish';
  }
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
(async function init() {
  if (!S.token) { renderSetup(); return; }
  renderLoading();
  try { await boot(); }
  catch(e) { toast('error', 'Auto-connect failed', e.message); renderSetup(); }
})();
</script>
</body>
</html>
