<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Editor — Omer Moran</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111110;
      --panel: #1a1a18;
      --panel2: #222220;
      --border: rgba(255,255,255,0.08);
      --accent: #456abf;
      --accent-rgb: 69,106,191;
      --text: #f0efe9;
      --text-dim: rgba(240,239,233,0.55);
      --text-dimmer: rgba(240,239,233,0.3);
      --success: #2a9d5c;
      --error: #e05a5a;
      --warning: #e09a2a;
    }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 9999;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
    .spacer { flex: 1; }

    /* Status pill */
    #status-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dimmer); padding: 4px 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 100px; white-space: nowrap; }
    .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dimmer); flex-shrink: 0; transition: all .3s; }
    .sdot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .sdot.dirty { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
    .sdot.pub { background: var(--accent); animation: blink .8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 7px 14px; border: none; cursor: pointer; transition: all .2s; white-space: nowrap; border-radius: 5px; }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { filter: brightness(1.1); }
    .btn-accent:not(:disabled) { box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); }
    .preview-link { font-size: 12px; color: var(--text-dim); text-decoration: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; transition: all .15s; }
    .preview-link:hover { color: var(--text); }

    /* Branch selector */
    #branch-sel { background: var(--panel2); border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 10px; border-radius: 5px; outline: none; cursor: pointer; max-width: 200px; }
    #branch-sel:focus { border-color: rgba(var(--accent-rgb),.5); color: var(--text); }

    /* Undo chip */
    #undo-count { font-size: 11px; color: var(--text-dimmer); background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px; display: none; }

    /* ── Iframe ── */
    #preview {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100vh - 52px);
      border: none; display: block;
    }

    /* ── Modal overlay ── */
    #overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    #overlay.hidden { display: none; }
    #modal {
      background: var(--panel); border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px; padding: 36px; max-width: 460px; width: 100%;
    }
    .modal-logo { display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; margin-bottom: 20px; }
    .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 13.5px; color: var(--text-dim); line-height: 1.65; margin-bottom: 24px; }
    .step { display: flex; gap: 12px; background: rgba(255,255,255,.03); border-radius: 7px; padding: 11px 13px; margin-bottom: 9px; }
    .step-n { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); font-size: 13px; min-width: 16px; }
    .step-t { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
    .step-t a { color: var(--accent); text-decoration: none; }
    .step-t a:hover { text-decoration: underline; }
    .lbl { display: block; font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; letter-spacing: .05em; }
    .inp { width: 100%; padding: 9px 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; border-radius: 6px; outline: none; transition: border-color .2s; margin-bottom: 13px; }
    .inp:focus { border-color: rgba(var(--accent-rgb),.6); }
    .hint { font-size: 11px; color: var(--text-dimmer); line-height: 1.5; margin-bottom: 6px; }
    #modal-err { font-size: 12px; color: var(--error); min-height: 18px; margin-bottom: 8px; }

    /* ── Toast ── */
    #tw { position: fixed; bottom: 18px; right: 18px; z-index: 99998; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
    .toast { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 15px; display: flex; gap: 10px; box-shadow: 0 6px 28px rgba(0,0,0,.5); animation: tIn .2s ease; max-width: 300px; }
    @keyframes tIn { from{transform:translateX(10px);opacity:0} to{transform:none;opacity:1} }
    .toast.ok  { border-color: rgba(42,157,92,.35); }
    .toast.err { border-color: rgba(224,90,90,.35); }
    .t-ic { font-size: 15px; line-height: 1; margin-top: 1px; }
    .t-tx { font-size: 13px; font-weight: 600; }
    .t-su { font-size: 11px; color: var(--text-dimmer); margin-top: 2px; line-height: 1.4; }

    /* Loading overlay on iframe */
    #load-cover {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      background: #faf9f6; z-index: 100;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: #666;
      pointer-events: none;
    }
    #load-cover.gone { display: none; }
    .spin { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,.08); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.07); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <div class="brand"><div class="brand-dot"></div>Site Editor</div>
  <div class="sep"></div>
  <div id="status-pill"><div id="sdot" class="sdot"></div><span id="stxt">Not connected</span></div>
  <div class="spacer"></div>
  <span id="undo-count"></span>
  <select id="branch-sel" style="display:none" title="Branch"></select>
  <a id="preview-link" class="preview-link" href="/en" target="_blank" style="display:none">↗ Live site</a>
  <button id="btn-connect" class="btn btn-ghost" onclick="showModal()">Connect GitHub</button>
  <button id="btn-publish" class="btn btn-accent" disabled onclick="publish()">Publish</button>
</div>

<!-- Site preview (edit mode) -->
<iframe id="preview" src="about:blank"></iframe>

<!-- Loading cover (shown while iframe loads) -->
<div id="load-cover"><div class="spin"></div>Loading site…</div>

<!-- Toast container -->
<div id="tw"></div>

<!-- GitHub connect modal -->
<div id="overlay" class="hidden">
  <div id="modal">
    <div class="modal-logo"><div class="brand-dot"></div>Site Editor</div>
    <div class="modal-title">Connect to GitHub</div>
    <div class="modal-sub">Enter your GitHub token to load and publish the site.</div>
    <div class="step"><div class="step-n">1</div><div class="step-t">Go to <a href="https://github.com/settings/tokens/new?scopes=repo&description=Site+Editor" target="_blank">GitHub → Settings → Tokens</a> and generate a token with <strong>repo</strong> scope.</div></div>
    <div class="step"><div class="step-n">2</div><div class="step-t">Paste the token below. It stays in your browser only.</div></div>
    <br>
    <label class="lbl">GitHub Personal Access Token</label>
    <input class="inp" id="inp-token" type="password" placeholder="ghp_..." autocomplete="off">
    <label class="lbl">Branch</label>
    <input class="inp" id="inp-branch" value="claude/AI-smbs-main" autocomplete="off">
    <div id="modal-err"></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;padding:11px" onclick="connect()">Connect & Load Site</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:8px" onclick="hideModal()">Cancel</button>
  </div>
</div>

<script>
// ═══════════════════════════════
//  CONFIG
// ═══════════════════════════════
const REPO = 'omerm14/ai-smbs';
const FILE = 'en/index.html';

// ═══════════════════════════════
//  STATE
// ═══════════════════════════════
const S = {
  token:     localStorage.getItem('ed_token')  || '',
  branch:    localStorage.getItem('ed_branch') || 'claude/AI-smbs-main',
  sha:       null,
  raw:       '',
  pending:   {},   // 'path' → value  OR  '_list_PATH' → items[]
  history:   [],   // snapshots of pending for undo
  dirty:     false,
  connected: false,
};

// ═══════════════════════════════
//  PARSE / APPLY
// ═══════════════════════════════
const parseTweaks  = h => { const m = h.match(/\/\*EDITMODE-BEGIN\*\/([\s\S]*?)\/\*EDITMODE-END\*\//);  try { return m ? JSON.parse(m[1]) : null } catch { return null } };
const parseContent = h => { const m = h.match(/\/\*CONTENT-BEGIN\*\/([\s\S]*?)\/\*CONTENT-END\*\//);    try { return m ? JSON.parse(m[1]) : null } catch { return null } };
const applyContent = (h, c) => {
  if (h.includes('/*CONTENT-BEGIN*/'))
    return h.replace(/(\/\*CONTENT-BEGIN\*\/)[\s\S]*?(\/\*CONTENT-END\*\/)/, `$1${JSON.stringify(c, null, 2)}$2`);
  const mk = '} /*EDITMODE-END*/;';
  const i = h.indexOf(mk);
  return i < 0 ? h : h.slice(0, i + mk.length) + `\n\nconst SITE_CONTENT = /*CONTENT-BEGIN*/${JSON.stringify(c, null, 2)}/*CONTENT-END*/;` + h.slice(i + mk.length);
};

function setDeep(obj, path, val) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] === undefined || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}

// ═══════════════════════════════
//  GITHUB
// ═══════════════════════════════
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${S.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  let d; try { d = await r.json(); } catch { d = {}; }
  if (!r.ok) throw new Error(d.message || `GitHub ${r.status}`);
  return d;
}

async function loadFile() {
  const d = await gh(`/repos/${REPO}/contents/${FILE}?ref=${encodeURIComponent(S.branch)}`);
  S.sha = d.sha;
  S.raw = decodeURIComponent(escape(atob(d.content.replace(/\s/g, ''))));
  return S.raw;
}

async function commitFile(content) {
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const d = await gh(`/repos/${REPO}/contents/${FILE}`, {
    method: 'PUT',
    body: JSON.stringify({
      message: 'Update site content via visual editor',
      content: b64,
      sha: S.sha,
      branch: S.branch,
    })
  });
  S.sha = d.content.sha;
}

// ═══════════════════════════════
//  postMessage from iframe
// ═══════════════════════════════
window.addEventListener('message', e => {
  if (!e.data || e.data._src !== 'em') return;
  const { type, path, value, items } = e.data;

  // Save snapshot for undo
  S.history.push(JSON.parse(JSON.stringify(S.pending)));
  if (S.history.length > 50) S.history.shift();

  if (type === 'change') {
    setDeep(S.pending, path, value);
  } else if (type === 'list-replace') {
    S.pending['_list_' + path] = items;
  }

  markDirty();
});

// ═══════════════════════════════
//  UI STATE
// ═══════════════════════════════
function markDirty() {
  S.dirty = true;
  updateUI();
}

function updateUI() {
  const dot  = document.getElementById('sdot');
  const txt  = document.getElementById('stxt');
  const pub  = document.getElementById('btn-publish');
  const undo = document.getElementById('undo-count');

  if (!S.connected) {
    dot.className = 'sdot'; txt.textContent = 'Not connected';
    pub.disabled = true; return;
  }
  if (S.dirty) {
    dot.className = 'sdot dirty';
    const n = Object.keys(S.pending).length;
    txt.textContent = `${n} unsaved change${n === 1 ? '' : 's'}`;
    pub.disabled = false;
  } else {
    dot.className = 'sdot ok';
    txt.textContent = `Connected · ${S.branch}`;
    pub.disabled = true;
  }

  if (S.history.length > 0) {
    undo.style.display = '';
    undo.textContent = `${S.history.length} change${S.history.length === 1 ? '' : 's'}`;
  } else {
    undo.style.display = 'none';
  }
}

function undoLast() {
  if (!S.history.length) return;
  S.pending = S.history.pop();
  S.dirty = Object.keys(S.pending).length > 0;
  updateUI();
  // Reload iframe to reflect undo (edit mode state lives in iframe)
  reloadFrame();
}

// ═══════════════════════════════
//  FRAME
// ═══════════════════════════════
function loadFrame() {
  document.getElementById('load-cover').classList.remove('gone');
  const frame = document.getElementById('preview');
  frame.onload = () => document.getElementById('load-cover').classList.add('gone');
  frame.src = `/en?editmode=1&t=${Date.now()}`;
}

function reloadFrame() {
  loadFrame();
}

// ═══════════════════════════════
//  CONNECT
// ═══════════════════════════════
async function connect() {
  const token  = document.getElementById('inp-token').value.trim();
  const branch = document.getElementById('inp-branch').value.trim() || 'claude/AI-smbs-main';
  const errEl  = document.getElementById('modal-err');

  if (!token) { errEl.textContent = 'Token is required.'; return; }
  errEl.textContent = '';

  const btn = document.querySelector('#modal .btn-accent');
  btn.textContent = 'Connecting…'; btn.disabled = true;

  S.token = token; S.branch = branch;
  localStorage.setItem('ed_token', token);
  localStorage.setItem('ed_branch', branch);

  try {
    await loadFile();
    S.connected = true;
    S.pending = {}; S.history = []; S.dirty = false;
    hideModal();
    updateUI();
    setupBranchSel();

    document.getElementById('preview-link').style.display = '';
    document.getElementById('preview-link').href = '/en';
    document.getElementById('branch-sel').style.display = '';
    loadFrame();
    toast('ok', 'Connected!', `Branch: ${S.branch}`);
  } catch (err) {
    errEl.textContent = err.message;
    btn.textContent = 'Connect & Load Site'; btn.disabled = false;
  }
}

function setupBranchSel() {
  const sel = document.getElementById('branch-sel');
  const branches = ['claude/AI-smbs-main', S.branch].filter((v, i, a) => a.indexOf(v) === i);
  sel.innerHTML = branches.map(b => `<option value="${b}"${b===S.branch?' selected':''}>${b}</option>`).join('');
  sel.onchange = () => {
    S.branch = sel.value;
    localStorage.setItem('ed_branch', S.branch);
    S.pending = {}; S.history = {}; S.dirty = false;
    updateUI();
    loadFrame();
    toast('ok', 'Branch switched', S.branch);
  };
}

// ═══════════════════════════════
//  PUBLISH
// ═══════════════════════════════
async function publish() {
  if (!S.connected) { showModal(); return; }
  if (!S.dirty) return;

  const btn = document.getElementById('btn-publish');
  const dot = document.getElementById('sdot');

  btn.textContent = 'Publishing…'; btn.disabled = true;
  dot.className = 'sdot pub';
  document.getElementById('stxt').textContent = 'Publishing…';

  try {
    // Re-fetch to get latest sha + raw
    const raw = await loadFile();
    let content = parseContent(raw);
    if (!content) throw new Error('Could not parse site content');

    // Apply all pending changes
    for (const [key, val] of Object.entries(S.pending)) {
      if (key.startsWith('_list_')) {
        setDeep(content, key.slice(6), val);
      } else {
        setDeep(content, key, val);
      }
    }

    const updated = applyContent(raw, content);
    await commitFile(updated);

    S.pending = {}; S.history = []; S.dirty = false;
    btn.textContent = 'Publish';
    updateUI();
    toast('ok', 'Published!', 'Vercel is deploying — usually takes ~30s.');

    // Reload iframe after deploy grace period
    setTimeout(reloadFrame, 3000);
  } catch (err) {
    btn.textContent = 'Publish'; btn.disabled = false;
    updateUI();
    toast('err', 'Publish failed', err.message);
  }
}

// ═══════════════════════════════
//  MODAL
// ═══════════════════════════════
function showModal() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  if (S.token) document.getElementById('inp-token').value = S.token;
  document.getElementById('inp-branch').value = S.branch;
  document.getElementById('modal-err').textContent = '';
  const btn = document.querySelector('#modal .btn-accent');
  btn.textContent = 'Connect & Load Site'; btn.disabled = false;
}

function hideModal() {
  document.getElementById('overlay').classList.add('hidden');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) hideModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); publish(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undoLast(); }
});

// ═══════════════════════════════
//  TOAST
// ═══════════════════════════════
function toast(type, title, sub) {
  const tw = document.getElementById('tw');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="t-ic">${type === 'ok' ? '✓' : '✕'}</div><div><div class="t-tx">${title}</div>${sub ? `<div class="t-su">${sub}</div>` : ''}</div>`;
  tw.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
(async () => {
  updateUI();
  document.getElementById('undo-count').addEventListener('click', undoLast);
  document.getElementById('undo-count').title = 'Undo last change (⌘Z)';
  document.getElementById('undo-count').style.cursor = 'pointer';

  if (S.token) {
    try {
      await loadFile();
      S.connected = true;
      updateUI();
      setupBranchSel();
      document.getElementById('preview-link').style.display = '';
      document.getElementById('branch-sel').style.display = '';
      document.getElementById('inp-token').value = S.token;
      document.getElementById('inp-branch').value = S.branch;
      loadFrame();
    } catch {
      showModal();
    }
  } else {
    showModal();
    document.getElementById('load-cover').classList.add('gone');
  }
})();
</script>
</body>
</html>
