  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --bg2: #f3f2ee;
      --surface: #ffffff;
      --border: rgba(14,14,12,0.08);
      --border-mid: rgba(14,14,12,0.14);
      --gold: #456abf;
      --gold-rgb: 69,106,191;
      --gold-light: #456abf55;
      --gold-pale: #456abf12;
      --text: #0e0e0c;
      --text-dim: #5a5a54;
      --text-dimmer: #9a9a90;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    #root { position: relative; z-index: 1; }

    /* Cursor glow */
    #cursor-glow {
      pointer-events: none; position: fixed; z-index: 9999;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--gold-rgb), 0.22) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      mix-blend-mode: multiply;
    }

    /* ── Nav ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 24px 64px; transition: padding 0.4s, background 0.4s, box-shadow 0.4s; }
    nav.scrolled { padding: 16px 64px; background: rgba(250,249,246,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 1px 0 var(--border); }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--text); text-transform: uppercase; }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 13px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 11px 26px; background: var(--text); color: var(--bg); text-decoration: none; display: inline-block; position: relative; overflow: hidden; transition: background 0.3s; }

    /* ── Language Toggle ── */
    .lang-toggle { display: flex; align-items: center; border: 1px solid var(--border-mid); border-radius: 100px; padding: 3px; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); gap: 2px; }
    .lang-btn { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 13px; text-decoration: none; color: var(--text-dim); transition: color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease; border-radius: 100px; }
    .lang-btn.active { background: var(--text); color: var(--bg); box-shadow: 0 2px 8px rgba(14,14,12,0.18); }
    .lang-btn:not(.active):hover { color: var(--text); background: rgba(14,14,12,0.06); transform: scale(1.04); }

    /* ── Testimonials ── */
    .testimonials-section { background: var(--bg); padding: 100px 64px; position: relative; overflow: hidden; }
    .testimonials-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .testimonials-intro { max-width: 540px; margin-bottom: 64px; }
    .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .tcard { background: var(--surface); border: 1px solid var(--border); padding: 36px 32px 28px; position: relative; display: flex; flex-direction: column; gap: 24px; transition: box-shadow 0.35s cubic-bezier(0.16,1,0.3,1), transform 0.35s cubic-bezier(0.16,1,0.3,1), border-color 0.25s; cursor: default; }
    .tcard:hover { box-shadow: 0 16px 48px rgba(14,14,12,0.09); transform: translateY(-4px); border-color: var(--border-mid); }
    .tcard-featured { border-color: rgba(var(--gold-rgb),0.25); }
    .tcard-featured:hover { border-color: rgba(var(--gold-rgb),0.5); box-shadow: 0 16px 48px rgba(var(--gold-rgb),0.1); }
    .tcard-quote { font-size: 14px; line-height: 1.85; color: var(--text); font-weight: 400; flex: 1; }
    .tcard-quote::before { content: '"'; font-family: 'Space Grotesk', sans-serif; font-size: 56px; line-height: 0.75; color: var(--gold); opacity: 0.5; display: block; margin-bottom: 16px; }
    .tcard-quote strong { font-weight: 700; color: var(--text); }
    .tcard-author { display: flex; align-items: center; gap: 14px; padding-top: 20px; border-top: 1px solid var(--border); }
    .tcard-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: var(--gold-pale); border: 1.5px solid rgba(var(--gold-rgb),0.25); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: var(--gold); }
    .tcard-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .tcard-role { font-size: 11px; color: var(--text-dimmer); line-height: 1.4; }
    .tcard-badge { position: absolute; top: -1px; left: 32px; background: var(--gold); color: white; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 10px; }

    /* ── LinkedIn CTA ── */
    .linkedin-hero-cta { display: inline-flex; align-items: center; gap: 14px; background: #0a66c2; color: #fff; padding: 16px 32px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-decoration: none; transition: transform 0.25s, box-shadow 0.25s, background 0.2s; position: relative; overflow: hidden; }
    .linkedin-hero-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: translateX(-100%); transition: transform 0.5s; }
    .linkedin-hero-cta:hover { background: #004182; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(10,102,194,0.45); }
    .linkedin-hero-cta:hover::after { transform: translateX(100%); }
    .contact-btn-meet { background: #1a73e8; color: #fff; }
    .contact-btn-meet:hover { box-shadow: 0 12px 36px rgba(26,115,232,0.45); }

    /* ── LinkedIn Section ── */
    .linkedin-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .linkedin-section::before { content: ''; position: absolute; top: -300px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.07) 0%, transparent 70%); pointer-events: none; }
    .linkedin-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .linkedin-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .linkedin-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 3vw, 40px); font-weight: 700; color: #faf9f6; line-height: 1.1; letter-spacing: -0.025em; margin-bottom: 8px; }
    .linkedin-sub { font-size: 15px; color: rgba(250,249,246,0.45); font-weight: 300; margin-bottom: 0; }
    .linkedin-header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 56px; gap: 40px; }
    .linkedin-profile-link { display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(var(--gold-rgb),0.35); padding-bottom: 3px; flex-shrink: 0; transition: gap 0.2s, border-color 0.2s; }
    .linkedin-profile-link:hover { gap: 13px; border-color: var(--gold); }
    .linkedin-carousel-wrap { position: relative; }
    .linkedin-carousel { display: flex; gap: 24px; overflow: hidden; }
    .li-screenshot { flex: 0 0 calc(33.33% - 16px); background: #fff; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.2); overflow: hidden; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s; cursor: pointer; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; position: relative; text-decoration: none; color: inherit; display: block; }
    .li-screenshot:hover { transform: translateY(-6px); box-shadow: 0 28px 70px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.25); }
    .li-screenshot:hover .li-hover-overlay { opacity: 1 !important; }
    .li-hover-overlay { position: absolute; inset: 0; background: rgba(10,102,194,0.07); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; z-index: 10; border-radius: 8px; pointer-events: none; }
    .li-chrome { background: #fff; padding: 12px 16px 0; border-bottom: 1px solid #e0e0e0; }
    .li-chrome-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .li-chrome-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .li-chrome-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .li-chrome-info { flex: 1; }
    .li-chrome-name { font-size: 14px; font-weight: 600; color: #000; line-height: 1.3; }
    .li-chrome-meta { font-size: 12px; color: #666; margin-top: 1px; }
    .li-post-content { padding: 14px 16px 12px; font-size: 13px; line-height: 1.6; color: #000; direction: ltr; text-align: left; }
    .li-post-reactions-bar { padding: 6px 16px 8px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #e0e0e0; }
    .li-post-counts { font-size: 12px; color: #666; display: flex; gap: 12px; }
    .li-post-actions { display: flex; justify-content: space-around; padding: 4px 8px 8px; border-top: 1px solid #e0e0e0; gap: 4px; }
    .li-action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px; border-radius: 4px; font-size: 12px; color: #666; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .li-action-btn:hover { background: #f3f3f3; }
    .carousel-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 36px; }
    .carousel-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .carousel-btn:hover { background: var(--gold); border-color: var(--gold); color: #fff; }
    .carousel-dots { display: flex; gap: 8px; }
    .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s, transform 0.3s; cursor: pointer; }
    .carousel-dot.active { background: var(--gold); transform: scale(1.3); }
    .linkedin-edge-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); padding: 32px 36px; display: flex; align-items: center; gap: 32px; margin-top: 56px; }
    .linkedin-edge-text { flex: 1; }
    .linkedin-edge-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #faf9f6; margin-bottom: 8px; line-height: 1.2; }
    .linkedin-edge-sub { font-size: 14px; color: rgba(250,249,246,0.5); line-height: 1.7; font-weight: 300; }
    .linkedin-edge-stat { text-align: center; flex-shrink: 0; padding: 0 0 0 24px; border-left: 1px solid rgba(255,255,255,0.08); }
    .linkedin-edge-stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; color: var(--gold); line-height: 1; }
    .linkedin-edge-stat-label { font-size: 11px; color: rgba(250,249,246,0.4); margin-top: 4px; letter-spacing: 0.06em; }
    .nav-cta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: translateX(-100%); transition: transform 0.5s ease; }
    .nav-cta:hover { background: var(--gold); }
    .nav-cta:hover::after { transform: translateX(100%); }

    /* ── Hero ── */
    .hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 120px 64px 80px; gap: 80px; position: relative; overflow: hidden; }
    .hero-bg-grid { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(var(--gold-rgb),0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--gold-rgb),0.045) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%); -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%); }
    .hero-glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.13) 0%, transparent 65%); right: -8%; top: 50%; transform: translateY(-50%); pointer-events: none; filter: blur(40px); animation: floatGlow 7s ease-in-out infinite alternate; }
    @keyframes floatGlow { 0% { transform: translateY(-50%) scale(1); } 100% { transform: translateY(-56%) scale(1.1); } }
    .hero-content { position: relative; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 32px; opacity: 0; animation: fadeUp 0.6s 0.1s ease forwards; }
    .hero-eyebrow-line { display: inline-block; width: 32px; height: 1px; background: var(--gold); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .reveal-line { overflow: hidden; display: block; }
    .reveal-word { display: inline-block; transform: translateY(110%); opacity: 0; animation: wordUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes wordUp { to { transform: translateY(0); opacity: 1; } }
    .hero-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(44px, 4.8vw, 76px); font-weight: 700; line-height: 1.03; letter-spacing: -0.03em; margin-bottom: 32px; }
    .hero-sub { font-size: 17px; line-height: 1.75; color: var(--text-dim); max-width: 480px; margin-bottom: 52px; font-weight: 300; opacity: 0; animation: fadeUp 0.8s 1s ease forwards; }
    .hero-actions { display: flex; gap: 20px; align-items: center; opacity: 0; animation: fadeUp 0.8s 1.2s ease forwards; }
    .btn-primary { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 16px 40px; background: var(--text); color: var(--bg); border: none; cursor: pointer; text-decoration: none; display: inline-block; position: relative; overflow: hidden; transition: background 0.3s, transform 0.25s, box-shadow 0.25s; }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); transform: translateX(-100%); transition: transform 0.55s ease; }
    .btn-primary:hover { background: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(var(--gold-rgb),0.3); }
    .btn-primary:hover::after { transform: translateX(100%); }
    .btn-ghost { font-size: 13px; color: var(--text-dim); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: color 0.2s, gap 0.25s; }
    .btn-ghost:hover { color: var(--text); gap: 14px; }
    .hero-image-wrap { position: relative; display: flex; justify-content: center; opacity: 0; animation: fadeUp 1s 0.4s ease forwards; }
    .photo-frame { position: relative; width: 400px; }
    .photo-frame img { width: 100%; display: block; filter: contrast(1.02) brightness(1.01); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover img { transform: scale(1.02); }
    .photo-frame::before { content: ''; position: absolute; top: 20px; left: 20px; right: -20px; bottom: -20px; border: 1px solid var(--gold-light); z-index: -1; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1); }
    .photo-frame:hover::before { transform: translate(4px, 4px); }
    .photo-credential { position: absolute; bottom: -16px; left: -24px; background: var(--surface); border: 1px solid var(--border-mid); padding: 16px 22px; box-shadow: 0 12px 48px rgba(14,14,12,0.12); min-width: 180px; animation: fadeUp 1s 0.9s ease both; }
    .cred-label { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .cred-name { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .cred-title { font-size: 11px; color: var(--text-dim); }

    /* ── Marquee ── */
    .marquee-strip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 0; background: var(--text); overflow: hidden; }
    .marquee-track { display: flex; animation: marqueeScroll 28s linear infinite; width: max-content; }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-item { display: inline-flex; align-items: center; gap: 20px; padding: 0 40px; white-space: nowrap; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(250,249,246,0.45); }
    .marquee-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    /* ── Impact Numbers ── */
    .impact-section { background: var(--bg); padding: 100px 64px; position: relative; overflow: hidden; }
    .impact-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
    .impact-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 60px; }
    .impact-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }
    .impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); position: relative; }
    .impact-grid::before { content: ''; position: absolute; top: 0; left: 33.33%; width: 1px; height: 100%; background: var(--border); }
    .impact-grid::after { content: ''; position: absolute; top: 0; left: 66.66%; width: 1px; height: 100%; background: var(--border); }
    .impact-item { padding: 0 56px 0 0; display: flex; flex-direction: column; }
    .impact-item:not(:first-child) { padding: 0 56px 0 56px; }
    .impact-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(72px, 9vw, 120px);
      font-weight: 700; line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--text);
      height: 130px;
      display: flex; align-items: flex-end; flex-wrap: wrap; gap: 0 8px;
      margin-bottom: 24px;
    }
    .impact-number .accent { color: var(--gold); font-size: clamp(32px, 4vw, 56px); font-weight: 700; align-self: flex-end; padding-bottom: 6px; }
    .impact-claim { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 12px; line-height: 1.2; }
    .impact-detail { font-size: 14px; line-height: 1.65; color: var(--text-dim); font-weight: 300; max-width: 260px; }

    /* ── How it works ── */
    .how-section { background: var(--text); padding: 100px 64px; position: relative; overflow: hidden; }
    .how-section::before { content: ''; position: absolute; top: -300px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--gold-rgb),0.08) 0%, transparent 70%); pointer-events: none; }
    .how-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 56px; }
    .how-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--gold); }

function ScannerCard({ service: s, delay }) {
  const [revealed, setRevealed] = useState(false);
  const [scanning, setScanning] = useState(false);

  const handleClick = () => {
    if (scanning) return;
    setScanning(true);
    setTimeout(() => {
      setRevealed(r => !r);
      setTimeout(() => setScanning(false), 200);
    }, 280);
  };

  return (
    <div className="svc-card-wrap reveal" style={{ transitionDelay: `${delay}s` }}>
      <div className={`svc-card${revealed ? ' revealed' : ''}${scanning ? ' scanning' : ''}`} onClick={handleClick}>
        <div className="svc-card-beam"></div>
        <div className="svc-card-front">
          <div className="service-icon">{s.icon}</div>
          <div className="service-name">{s.name}</div>
